    // ==========================================
    // 8. RENDER PIPELINE
    // ==========================================
    function render() {
      ctx.fillStyle = '#0b0d0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(state.camera.zoom, state.camera.zoom);

      const startTileX = Math.floor(-state.camera.x / TILE_SIZE);
      const startTileY = Math.floor(-state.camera.y / TILE_SIZE);
      const endTileX = startTileX + Math.ceil(canvas.width / (TILE_SIZE * state.camera.zoom)) + 1;
      const endTileY = startTileY + Math.ceil(canvas.height / (TILE_SIZE * state.camera.zoom)) + 1;

      // Draw Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;

      for (let x = startTileX; x < endTileX; x++) {
        const sx = x * TILE_SIZE + state.camera.x;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, canvas.height / state.camera.zoom);
        ctx.stroke();
      }
      for (let y = startTileY; y < endTileY; y++) {
        const sy = y * TILE_SIZE + state.camera.y;
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(canvas.width / state.camera.zoom, sy);
        ctx.stroke();
      }

      // Draw Source-to-Target Selection Line & Target Marker
      const selectedEntity = getSelectedEntity();
      if (selectedEntity && state.targetTile) {
        const sourceX = (selectedEntity.x !== undefined ? Math.floor(selectedEntity.x) : selectedEntity.tileX) * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
        const sourceY = (selectedEntity.y !== undefined ? Math.floor(selectedEntity.y) : selectedEntity.tileY) * TILE_SIZE + state.camera.y + TILE_SIZE / 2;
        const targetX = state.targetTile.x * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
        const targetY = state.targetTile.y * TILE_SIZE + state.camera.y + TILE_SIZE / 2;

        ctx.strokeStyle = '#d9a441';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(sourceX, sourceY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Highlight Target Tile Circle Marker
        ctx.strokeStyle = '#d9a441';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(targetX, targetY, 18, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Render Buildings
      state.buildings.forEach(b => {
        const px = b.tileX * TILE_SIZE + state.camera.x;
        const py = b.tileY * TILE_SIZE + state.camera.y;

        // Render progress bar background first (behind building)
        if (b.type === 'mine' && b.miningProgress > 0) {
          // Cyan progress bar for mining progress (0-1, where 1 = ready to harvest)
          const barHeight = 3;
          ctx.fillStyle = 'rgba(34, 211, 238, 0.4)'; // Cyan background
          ctx.fillRect(px, py + TILE_SIZE - barHeight, TILE_SIZE, barHeight);
          
          // Brighter cyan for actual progress
          ctx.fillStyle = 'rgb(34, 211, 238)';
          const progressWidth = TILE_SIZE * Math.min(b.miningProgress, 1);
          ctx.fillRect(px, py + TILE_SIZE - barHeight, progressWidth, barHeight);
        }

        if (b.type === 'residence' && b.growthProgress > 0) {
          // Cyan progress bar for civilian growth (0-5, where 5 = ready to spawn)
          const barHeight = 3;
          ctx.fillStyle = 'rgba(34, 211, 238, 0.4)'; // Cyan background
          ctx.fillRect(px, py + TILE_SIZE - barHeight, TILE_SIZE, barHeight);
          
          // Brighter cyan for actual progress
          ctx.fillStyle = 'rgb(34, 211, 238)';
          const progressWidth = TILE_SIZE * Math.min(b.growthProgress / 5, 1); // 0-5 normalized to 0-1
          ctx.fillRect(px, py + TILE_SIZE - barHeight, progressWidth, barHeight);
        }

        let img = null;
        if (b.type === 'mine') img = IMAGES.mine;
        if (b.type === 'residence') img = IMAGES.residence;
        if (b.type === 'barracks') img = IMAGES.barracks;
        if (b.type === 'armory') img = IMAGES.armory;
        if (b.type === 'radar') img = IMAGES.radar;

        if (img) {
          // Scale image to fit tile
          const maxSize = TILE_SIZE - 8;
          let scaleX = 1, scaleY = 1;
          
          if (img.width > maxSize) {
            scaleX = maxSize / img.width;
          }
          if (img.height > maxSize) {
            scaleY = maxSize / img.height;
          }
          
          const scale = Math.min(scaleX, scaleY);
          const scaledWidth = img.width * scale;
          const scaledHeight = img.height * scale;
          
          const imgX = px + (TILE_SIZE - scaledWidth) / 2;
          const imgY = py + (TILE_SIZE - scaledHeight) / 2;
          
          ctx.drawImage(img, imgX, imgY, scaledWidth, scaledHeight);
        } else {
          ctx.fillStyle = b.type === 'mine' ? '#5b8ab5' : 
                          b.type === 'residence' ? '#7a9d5c' : 
                          b.type === 'barracks' ? '#c17a3f' : '#8f6f9e';
          ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        }

        if (b.id === state.selectedEntityId) {
          ctx.strokeStyle = '#d9a441';
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        }
      });

      // Render Active Unit Path Lines
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;

        if (u.x !== u.targetX || u.y !== u.targetY) {
          const startX = u.x * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
          const startY = u.y * TILE_SIZE + state.camera.y + TILE_SIZE / 2;
          const endX = u.targetX * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
          const endY = u.targetY * TILE_SIZE + state.camera.y + TILE_SIZE / 2;

          ctx.strokeStyle = u.type === 'civilian' ? 'rgba(34, 197, 94, 0.4)' : 'rgba(217, 164, 65, 0.3)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Pass 1: Multi-unit tile stack count calculation
      const tileUnitCounts = {};
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;
        const key = `${Math.floor(u.x)},${Math.floor(u.y)}`;
        tileUnitCounts[key] = (tileUnitCounts[key] || 0) + 1;
      });

      // Pass 2: Draw multi-occupancy units cleanly spaced inside their tile boundary
      const tileUnitIndices = {};
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;

        const tileKey = `${Math.floor(u.x)},${Math.floor(u.y)}`;
        const totalOnTile = tileUnitCounts[tileKey];
        const idxOnTile = tileUnitIndices[tileKey] || 0;
        tileUnitIndices[tileKey] = idxOnTile + 1;

        let subOffsetX = 0;
        let subOffsetY = 0;
        if (totalOnTile > 1) {
          const angle = (idxOnTile / totalOnTile) * Math.PI * 2;
          const radius = Math.min(14, 6 + totalOnTile * 2);
          subOffsetX = Math.cos(angle) * radius;
          subOffsetY = Math.sin(angle) * radius;
        }

        const px = u.x * TILE_SIZE + state.camera.x + subOffsetX;
        const py = u.y * TILE_SIZE + state.camera.y + subOffsetY;

        const assetKey = u.type === 'tank' ? 'tank' : (u.type === 'civilian' ? 'civilian' : 'soldier');
        const img = IMAGES[assetKey];
        
        // Only render if visible
        if (!isTileVisible(u.x, u.y)) {
          return;  // Skip this unit (forEach, not for loop)
        }

        if (img && img.width > 0 && img.height > 0) {
          // Scale image to fit tile with proper aspect ratio
          const maxSize = TILE_SIZE - 4;  // Leave small margin
          let scaleX = 1, scaleY = 1;
          
          if (img.width > maxSize) {
            scaleX = maxSize / img.width;
          }
          if (img.height > maxSize) {
            scaleY = maxSize / img.height;
          }
          
          const scale = Math.min(scaleX, scaleY);
          const scaledWidth = img.width * scale;
          const scaledHeight = img.height * scale;
          
          const imgX = px + (TILE_SIZE - scaledWidth) / 2;
          const imgY = py + (TILE_SIZE - scaledHeight) / 2;
          
          ctx.drawImage(img, imgX, imgY, scaledWidth, scaledHeight);
        } else {
          // Fallback circle if image not available
          ctx.fillStyle = u.type === 'tank' ? '#c1443a' : (u.type === 'civilian' ? '#c9a13c' : '#c17a3f');
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, u.type === 'tank' ? 18 : 10, 0, Math.PI * 2);
          ctx.fill();
        }

        if (u.id === state.selectedEntityId) {
          ctx.strokeStyle = '#d9a441';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 20, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(px + 8, py - 6, TILE_SIZE - 16, 4);
        ctx.fillStyle = '#7a9d5c';
        ctx.fillRect(px + 8, py - 6, (TILE_SIZE - 16) * (u.hp / u.maxHp), 4);
      });

      // Render Unit Count Badges (adaptive display for multiple units on same tile)
      Object.entries(tileUnitCounts).forEach(([key, count]) => {
        if (count > 1) {
          const [tileX, tileY] = key.split(',').map(Number);
          if (!isTileVisible(tileX, tileY)) return;
          
          const px = tileX * TILE_SIZE + state.camera.x;
          const py = tileY * TILE_SIZE + state.camera.y;
          
          // Draw badge background
          ctx.fillStyle = 'rgba(193, 122, 63, 0.8)';
          const badgeRadius = 10;
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE - 10, py + 10, badgeRadius, 0, Math.PI * 2);
          ctx.fill();
          
          // Draw count text
          ctx.fillStyle = '#e8e4d8';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(count, px + TILE_SIZE - 10, py + 10);
        }
      });

      // Render Fog of War
      if (GAME_CONFIG.FOG_OF_WAR_ENABLED) {
        // Render shroud (unexplored areas)
        ctx.fillStyle = GAME_CONFIG.FOG_SHROUD_COLOR;
        for (let gridX = Math.floor((-state.camera.x) / TILE_SIZE) - 1; gridX < Math.floor((-state.camera.x + canvas.width) / TILE_SIZE) + 1; gridX++) {
          for (let gridY = Math.floor((-state.camera.y) / TILE_SIZE) - 1; gridY < Math.floor((-state.camera.y + canvas.height) / TILE_SIZE) + 1; gridY++) {
            const tileKey = `${gridX},${gridY}`;
            
            // Only show fog on unexplored tiles
            if (!state.exploredTiles.has(tileKey)) {
              const px = gridX * TILE_SIZE + state.camera.x;
              const py = gridY * TILE_SIZE + state.camera.y;
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            }
          }
        }
        
        // Render explored but not visible fog (darker shroud)
        ctx.fillStyle = GAME_CONFIG.EXPLORED_COLOR;
        for (let gridX = Math.floor((-state.camera.x) / TILE_SIZE) - 1; gridX < Math.floor((-state.camera.x + canvas.width) / TILE_SIZE) + 1; gridX++) {
          for (let gridY = Math.floor((-state.camera.y) / TILE_SIZE) - 1; gridY < Math.floor((-state.camera.y + canvas.height) / TILE_SIZE) + 1; gridY++) {
            const tileKey = `${gridX},${gridY}`;
            
            // Show light fog on explored but not visible tiles
            if (state.exploredTiles.has(tileKey) && !state.visibleTiles.has(tileKey)) {
              const px = gridX * TILE_SIZE + state.camera.x;
              const py = gridY * TILE_SIZE + state.camera.y;
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            }
          }
        }
      }

      // Render Cannon Flare Effects
      shotFlares.forEach((flare) => {
        ctx.strokeStyle = `rgba(251, 146, 60, ${flare.life})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(flare.x1 * TILE_SIZE + state.camera.x, flare.y1 * TILE_SIZE + state.camera.y);
        ctx.lineTo(flare.x2 * TILE_SIZE + state.camera.x, flare.y2 * TILE_SIZE + state.camera.y);
        ctx.stroke();
        flare.life -= 0.05;
      });
      shotFlares = shotFlares.filter(f => f.life > 0);

      // Render Tile Hover Highlight
      const hx = state.hoveredTile.x * TILE_SIZE + state.camera.x;
      const hy = state.hoveredTile.y * TILE_SIZE + state.camera.y;

      if (state.buildMode) {
        const costs = { residence: 100, barracks: 200, armory: 500, radar: 250 };
        const cost = costs[state.buildMode] || 0;
        const occupied = state.buildings.some(b => b.tileX === state.hoveredTile.x && b.tileY === state.hoveredTile.y);
        const affordable = state.resources >= cost;
        const valid = !occupied && affordable;

        const color = valid ? '122, 157, 92' : '193, 68, 58'; // ok green / danger red
        ctx.fillStyle = `rgba(${color}, 0.18)`;
        ctx.fillRect(hx, hy, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = `rgb(${color})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(hx, hy, TILE_SIZE, TILE_SIZE);
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(hx, hy, TILE_SIZE, TILE_SIZE);
      }

      ctx.restore();
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      const deltaTime = now - lastTime;
      lastTime = now;

      applyKeyboardPan(deltaTime);
      updateCombatAndMovement(deltaTime);
      render();

      if (document.visibilityState === 'visible') {
        syncPersistenceTimestamp();
        saveGameState();
      }

      requestAnimationFrame(gameLoop);
    }


    // ==========================================
    // 9. UI UPDATER (WEB PAGE HUD & INSPECTOR PANEL)
    // ==========================================
    function updateUI() {
      updateBuildMenuDisplay();
      document.getElementById('ui-resources').innerText = Math.floor(state.resources);
      const totalCivs = state.units.filter(u => u.type === 'civilian').length;
      document.getElementById('ui-civilians').innerText = `${totalCivs} / ${state.civilianCap}`;
      
      let totalMiners = state.units.filter(u => {
        if (u.type !== 'civilian') return false;
        if (u.assignedMineId) return true;  // explicitly assigned to a mine
        // Check if garrisoned in a mine building
        if (u.garrisonedBuildingId) {
          const building = state.buildings.find(b => b.id === u.garrisonedBuildingId);
          return building && building.type === 'mine';
        }
        return false;
      }).length;
      document.getElementById('ui-miners').innerText = totalMiners;

      const soldierCount = state.units.filter(u => u.type === 'soldier').length;
      const tankCount = state.units.filter(u => u.type === 'tank').length;
      document.getElementById('ui-tanks').innerText = tankCount;
      document.getElementById('ui-soldiers').innerText = soldierCount;

      const entity = getSelectedEntity();
      const titleEl = document.getElementById('inspector-title');
      const detailsEl = document.getElementById('inspector-details');
      const actionsEl = document.getElementById('inspector-actions');
      const deselectBtn = document.getElementById('btn-deselect');
      actionsEl.innerHTML = '';

      if (!entity) {
        // Hover Preview Info Card inside the Web Interface
        const hoveredBld = state.buildings.find(b => b.tileX === state.hoveredTile.x && b.tileY === state.hoveredTile.y);
        if (hoveredBld) {
          const info = getBuildingInfo(hoveredBld.type);
          const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === hoveredBld.id);
          const maxCap = hoveredBld.capacity || hoveredBld.capBonus || 10;

          let unitBreakdown = "";
          if (garrisonedUnits.length === 0) {
            unitBreakdown = "<span style='color: #5f6459;'>None</span>";
          } else {
            const counts = {};
            garrisonedUnits.forEach(u => { counts[u.type] = (counts[u.type] || 0) + 1; });
            unitBreakdown = Object.entries(counts)
              .map(([type, count]) => `<span style="color:#d9a441;">${count} ${type.charAt(0).toUpperCase() + type.slice(1)}${count > 1 ? 's' : ''}</span>`)
              .join(', ');
          }

          // Special note for residences about the 10 civilian capacity
          let residenceNote = '';
          if (hoveredBld.type === 'residence') {
            const civiliansInRes = state.units.filter(u => u.type === 'civilian' && u.garrisonedBuildingId === hoveredBld.id).length;
            residenceNote = `<div style="margin-top: 6px; padding: 4px; background: rgba(34, 211, 238, 0.1); border-left: 2px solid #22d3ee; font-size: 10px; color: #22d3ee;"><strong>CAPACITY:</strong> ${civiliansInRes}/10 | Grows if not full | Replenishes if losses occur</div>`;
          }

          titleEl.innerText = `Hover Preview: ${info.title} #${hoveredBld.id}`;
          detailsEl.innerHTML = `
            <div style="margin-bottom: 4px;">
              <strong style="color: #e8e4d8;">${info.title} Info Card</strong>
              <div style="color: #5f6459; font-size: 11px;">${info.stats}</div>
            </div>
            <div style="margin-bottom: 6px; font-size: 11px; color: #9a9f8e;">${info.desc}</div>
            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;">
              <div><strong>HP:</strong> ${hoveredBld.hp}/${hoveredBld.maxHp} | <strong>Tile:</strong> (${hoveredBld.tileX}, ${hoveredBld.tileY})</div>
              <div style="margin-top: 2px;"><strong>Units Inside (${garrisonedUnits.length}/${maxCap}):</strong> ${unitBreakdown}</div>
            </div>
            ${residenceNote}
          `;
          deselectBtn.style.display = 'none';
          return;
        }

        titleEl.innerText = 'Selection: None';
        detailsEl.innerText = 'Left-click to select a unit or structure. Right-click a tile to move/target it. Drag (or WASD/arrows) to pan, scroll to zoom, Esc to cancel/deselect.';
        deselectBtn.style.display = 'none';
        return;
      }

      deselectBtn.style.display = 'block';
      const targetText = state.targetTile ? ` | Target: (${state.targetTile.x}, ${state.targetTile.y})` : ' | Target: None (Right-click grid)';

      if (entity.entityType === 'unit') {
        const uTileX = Math.floor(entity.x);
        const uTileY = Math.floor(entity.y);
        const unitsOnSameTile = state.units.filter(u => !u.garrisonedBuildingId && Math.floor(u.x) === uTileX && Math.floor(u.y) === uTileY);
        const uIdx = unitsOnSameTile.findIndex(u => u.id === entity.id) + 1;
        
        const stackText = unitsOnSameTile.length > 1 ? ` (${uIdx} of ${unitsOnSameTile.length} on Tile)` : '';

        // For civilians, display the civilian number prominently
        let titleText = `${entity.type.toUpperCase()}`;
        if (entity.type === 'civilian' && entity.civilianNumber) {
          titleText += ` #${entity.civilianNumber}`;
        } else {
          titleText += ` (ID: ${entity.id})`;
        }
        titleText += stackText;

        titleEl.innerText = titleText;
        detailsEl.innerText = `HP: ${Math.ceil(entity.hp)}/${entity.maxHp} | Tile: (${uTileX}, ${uTileY})${targetText}`;

        if (entity.type === 'civilian') {
          const status = entity.assignedMineId ? `Mining Mine #${entity.assignedMineId}` : 'Idle / Moving';
          detailsEl.innerText += ` | Status: ${status}`;
        } else if (entity.type === 'tank') {
          detailsEl.innerText += ` | Cannon DPS: 0.5`;
          
          const modes = ['aggressive', 'ignore_infantry', 'ignore_buildings', 'prioritize_buildings', 'hold_fire'];
          modes.forEach(mode => {
            const btn = document.createElement('button');
            btn.className = `fc-btn ${entity.fireControl === mode ? 'active-mode' : ''}`;
            btn.innerText = mode.replace('_', ' ');
            btn.onclick = () => setFireControl(entity, mode);
            actionsEl.appendChild(btn);
          });
        }
      } else if (entity.entityType === 'building') {
        const info = getBuildingInfo(entity.type);
        const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === entity.id);
        const maxCap = entity.capacity || entity.capBonus || 10;

        let unitBreakdown = "";
        if (garrisonedUnits.length === 0) {
          unitBreakdown = "<span style='color: #5f6459;'>None</span>";
        } else {
          const counts = {};
          garrisonedUnits.forEach(u => { counts[u.type] = (counts[u.type] || 0) + 1; });
          unitBreakdown = Object.entries(counts)
            .map(([type, count]) => `<span style="color:#d9a441;">${count} ${type.charAt(0).toUpperCase() + type.slice(1)}${count > 1 ? 's' : ''}</span>`)
            .join(', ');
        }

        titleEl.innerText = `${info.title.toUpperCase()} (ID: ${entity.id})`;

        // Special note for residences about the 10 civilian capacity
        let residenceNote = '';
        if (entity.type === 'residence') {
          const civiliansInRes = state.units.filter(u => u.type === 'civilian' && u.garrisonedBuildingId === entity.id).length;
          residenceNote = `<div style="margin-top: 6px; padding: 4px; background: rgba(34, 211, 238, 0.1); border-left: 2px solid #22d3ee; font-size: 10px; color: #22d3ee;"><strong>CAPACITY:</strong> ${civiliansInRes}/10 | Grows if not full | Replenishes if losses occur</div>`;
        }

        detailsEl.innerHTML = `
          <div style="margin-bottom: 4px;">
            <strong style="color: #e8e4d8;">${info.title} Info Card</strong>
            <div style="color: #5f6459; font-size: 11px;">${info.stats}</div>
          </div>
          <div style="margin-bottom: 6px; font-size: 11px; color: #9a9f8e;">${info.desc}</div>
          <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;">
            <div><strong>HP:</strong> ${entity.hp}/${entity.maxHp} | <strong>Tile:</strong> (${entity.tileX}, ${entity.tileY})${targetText}</div>
            <div style="margin-top: 2px;"><strong>Units Inside (${garrisonedUnits.length}/${maxCap}):</strong> ${unitBreakdown}</div>
          </div>
          ${residenceNote}
        `;

        // Deploy button available for ANY structure holding garrisoned units
        if (garrisonedUnits.length > 0) {
          const deployBtn = document.createElement('button');
          deployBtn.innerHTML = `<img src="${ASSETS.civilian}" /> Deploy Garrisoned Units`;
          deployBtn.onclick = () => openStructureGarrisonDialog(entity);
          actionsEl.appendChild(deployBtn);
        }

        if (entity.type === 'barracks') {
          const trainBtn = document.createElement('button');
          trainBtn.innerHTML = `<img src="${ASSETS.soldier}" /> Train / Rally Options`;
          trainBtn.onclick = () => openBarracksDialog(entity);
          actionsEl.appendChild(trainBtn);

        } else if (entity.type === 'armory') {
          const trainBtn = document.createElement('button');
          trainBtn.innerHTML = `<img src="${ASSETS.tank}" /> Train / Rally Options`;
          trainBtn.onclick = () => openArmoryDialog(entity);
          actionsEl.appendChild(trainBtn);
        }
      }
    }

    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
