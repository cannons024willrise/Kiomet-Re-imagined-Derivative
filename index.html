<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid RTS Engine - Kiomet & Travian Inspired</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --void: #0b0d0a;
      --panel: rgba(18, 21, 16, 0.93);
      --panel-raised: rgba(24, 28, 21, 0.96);
      --line: rgba(217, 164, 65, 0.20);
      --line-strong: rgba(217, 164, 65, 0.45);
      --amber: #d9a441;
      --amber-bright: #f2c368;
      --text: #e8e4d8;
      --text-dim: #9a9f8e;
      --text-faint: #5f6459;
      --ok: #7a9d5c;
      --danger: #c1443a;
      --font-display: 'Barlow Condensed', 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--void);
      font-family: var(--font-display);
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Faint scanline atmosphere over the whole viewport */
    #canvas-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.10) 0px,
        rgba(0, 0, 0, 0.10) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.35;
      z-index: 2;
    }

    /* Command HUD overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .hud-panel {
      position: relative;
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      border-radius: 2px;
      padding: 13px 20px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    /* Corner-bracket motif — reads as targeting/console framing */
    .hud-panel::before,
    .hud-panel::after,
    dialog::before,
    dialog::after {
      content: '';
      position: absolute;
      width: 11px;
      height: 11px;
      border: 2px solid var(--amber);
      pointer-events: none;
      opacity: 0.85;
    }
    .hud-panel::before, dialog::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .hud-panel::after, dialog::after   { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* Top HUD: Resource & Population Bar */
    #top-bar {
      align-self: center;
      display: flex;
      align-items: center;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-dim);
    }

    .res-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      border-left: 1px solid var(--line);
    }

    .res-item:first-child {
      border-left: none;
      padding-left: 0;
    }

    .res-item:last-child {
      padding-right: 0;
    }

    .res-item img {
      width: 17px;
      height: 17px;
      object-fit: contain;
      filter: drop-shadow(0 0 3px rgba(217, 164, 65, 0.35));
    }

    .res-value {
      color: var(--amber-bright);
      font-size: 15px;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0;
    }

    /* Bottom Inspector & Build Bar */
    #bottom-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    #inspector-panel {
      min-width: 360px;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
      margin-bottom: 2px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: var(--panel-raised);
      border: 1px solid var(--line-strong);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 0;
      clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    button:hover:not(:disabled) {
      background: rgba(217, 164, 65, 0.16);
      border-color: var(--amber);
      color: var(--amber-bright);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.08);
    }

    .active-mode {
      background: rgba(217, 164, 65, 0.22) !important;
      border-color: var(--amber) !important;
      color: var(--amber-bright) !important;
    }

    /* Fire Control Selection Styling */
    .fc-btn {
      font-size: 10.5px;
      padding: 5px 9px;
    }

    #build-menu {
      display: flex;
      gap: 8px;
    }

    .shortcut-tag {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0;
      text-transform: none;
      margin-left: 4px;
    }

    /* Modal Dialog Styling */
    dialog {
      position: relative;
      pointer-events: auto;
      background: var(--panel-raised);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--font-display);
      padding: 22px 26px;
      min-width: 340px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    dialog::before, dialog::after { width: 14px; height: 14px; }

    dialog::backdrop {
      background: rgba(4, 5, 3, 0.72);
      backdrop-filter: blur(4px);
    }

    .dialog-title {
      font-size: 16px;
      color: var(--amber-bright);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .dialog-body {
      font-size: 13.5px;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text-dim);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-layer">
    <!-- Top Bar -->
    <div id="top-bar" class="hud-panel">
      <div class="res-item">
        <img id="icon-res" alt="Resources" />
        <span>Resources:</span>
        <span id="ui-resources" class="res-value">0</span>
      </div>
      <div class="res-item">
        <img id="icon-civ" alt="Civilians" />
        <span>Civilians:</span>
        <span id="ui-civilians" class="res-value">15 / 20</span>
        <span style="font-size: 11px; color: #5f6459;">(<span id="ui-miners">0</span> Mining)</span>
      </div>
      <div class="res-item">
        <img id="icon-tank" alt="Tanks" />
        <span>Tanks:</span>
        <span id="ui-tanks" class="res-value">0</span>
      </div>
      <div class="res-item">
        <img id="icon-soldier" alt="Soldiers" />
        <span>Soldiers:</span>
        <span id="ui-soldiers" class="res-value">0</span>
      </div>
    </div>

    <!-- Bottom Interface -->
    <div id="bottom-hud">
      <!-- Context Inspector & Info Card Panel -->
      <div id="inspector-panel" class="hud-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="panel-title" id="inspector-title" style="border-bottom: none; margin-bottom: 0;">Selection: None</div>
          <button id="btn-deselect" style="display:none; padding: 2px 8px; font-size: 10px;" onclick="deselectEntity()">Deselect</button>
        </div>
        <div id="inspector-details" style="font-size: 12px; color: #9a9f8e; min-height: 24px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px;">
          Left-click to select a unit or structure. Right-click a tile to move/target it.
        </div>
        <div id="inspector-actions" class="btn-group"></div>
      </div>

      <!-- Quick Build Toolbar -->
      <div id="build-menu" class="hud-panel">
        <button onclick="setBuildMode('residence')"><img class="btn-icon-residence" /> Residence <span class="shortcut-tag">(100g)</span></button>
        <button onclick="setBuildMode('barracks')"><img class="btn-icon-barracks" /> Barracks <span class="shortcut-tag">(200g)</span></button>
        <button onclick="setBuildMode('armory')"><img class="btn-icon-armory" /> Armory <span class="shortcut-tag">(500g)</span></button>
        <button onclick="setBuildMode('radar')"><img class="btn-icon-radar" /> Radar <span class="shortcut-tag">(250g)</span></button>
        <button onclick="openSettingsPanel()" style="margin-left: auto; background: rgba(217, 164, 65, 0.2);">⚙ Settings</button>
      </div>
    </div>
  </div>

  <!-- HTML Sci-Fi Modal Dialog (Main Game Modal) -->
  <dialog id="game-modal">
    <div class="dialog-title" id="modal-title">System Message</div>
    <div class="dialog-body" id="modal-body">Message details...</div>
    <div class="dialog-actions" id="modal-actions">
      <button onclick="closeDialog()">OK</button>
    </div>
  </dialog>

  <!-- Settings Panel Modal -->
  <dialog id="settings-modal" style="width: 90%; max-width: 600px; max-height: 90vh;">
    <div class="dialog-title">GAME CONFIG SETTINGS</div>
    <div id="settings-content" class="dialog-body" style="overflow-y: auto; max-height: 70vh;">
      <!-- Settings will be populated by JavaScript -->
    </div>
    <div class="dialog-actions">
      <button onclick="resetGameConfig()">Reset to Defaults</button>
      <button onclick="closeSettingsPanel()">Close</button>
    </div>
  </dialog>

  <script>
    // ==========================================
    // 0. SETTINGS PANEL FUNCTIONS
    // ==========================================
    function openSettingsPanel() {
      const modal = document.getElementById('settings-modal');
      const content = document.getElementById('settings-content');
      
      let html = '<div style="display: grid; gap: 16px;">';
      
      // UI & Display Section
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">⚙ UI & Display</div>';
      html += createConfigInput('TILE_SIZE', GAME_CONFIG.TILE_SIZE, 'Tile Size (pixels)', 16, 128);
      html += createConfigInput('TICK_RATE', GAME_CONFIG.TICK_RATE, 'Tick Rate (ms)', 100, 5000);
      html += '</div>';
      
      // Building Costs
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">🏢 Building Costs</div>';
      html += createConfigInput('BUILDING_COSTS_residence', GAME_CONFIG.BUILDING_COSTS.residence, 'Residence Cost', 0, 500);
      html += createConfigInput('BUILDING_COSTS_barracks', GAME_CONFIG.BUILDING_COSTS.barracks, 'Barracks Cost', 0, 500);
      html += createConfigInput('BUILDING_COSTS_armory', GAME_CONFIG.BUILDING_COSTS.armory, 'Armory Cost', 0, 1000);
      html += createConfigInput('BUILDING_COSTS_radar', GAME_CONFIG.BUILDING_COSTS.radar, 'Radar Cost', 0, 500);
      html += '</div>';
      
      // Unit Costs
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">⚔️ Unit Costs</div>';
      html += createConfigInput('UNIT_COSTS_soldier', GAME_CONFIG.UNIT_COSTS.soldier, 'Soldier Cost', 0, 500);
      html += createConfigInput('UNIT_COSTS_tank', GAME_CONFIG.UNIT_COSTS.tank, 'Tank Cost', 0, 1000);
      html += '</div>';
      
      // Unit Stats
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">🛡️ Unit Stats (Soldier)</div>';
      html += createConfigInput('UNIT_STATS_soldier_hp', GAME_CONFIG.UNIT_STATS.soldier.hp, 'Soldier HP', 1, 20);
      html += createConfigInput('UNIT_STATS_soldier_speed', (GAME_CONFIG.UNIT_STATS.soldier.speed * 1000).toFixed(0), 'Soldier Speed (÷1000)', 1, 100);
      html += createConfigInput('UNIT_STATS_soldier_meleeDmg', GAME_CONFIG.UNIT_STATS.soldier.meleeDmg, 'Soldier Melee Damage', 1, 20);
      html += '</div>';
      
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">🛡️ Unit Stats (Tank)</div>';
      html += createConfigInput('UNIT_STATS_tank_hp', GAME_CONFIG.UNIT_STATS.tank.hp, 'Tank HP', 1, 50);
      html += createConfigInput('UNIT_STATS_tank_speed', (GAME_CONFIG.UNIT_STATS.tank.speed * 1000).toFixed(0), 'Tank Speed (÷1000)', 1, 100);
      html += createConfigInput('UNIT_STATS_tank_meleeDmg', GAME_CONFIG.UNIT_STATS.tank.meleeDmg, 'Tank Melee Damage', 1, 30);
      html += createConfigInput('UNIT_STATS_tank_cannonDmg', GAME_CONFIG.UNIT_STATS.tank.cannonDmg, 'Tank Cannon Damage', 1, 30);
      html += '</div>';
      
      // Economy
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">💰 Economy & Production</div>';
      html += createConfigInput('CIVILIAN_GROWTH_TICKS', GAME_CONFIG.CIVILIAN_GROWTH_TICKS, 'Civilian Growth Ticks', 1, 30);
      html += createConfigInput('MAX_CIVILIANS_PER_RESIDENCE', GAME_CONFIG.MAX_CIVILIANS_PER_RESIDENCE, 'Max Civs per Residence', 1, 30);
      html += createConfigInput('STARTING_RESOURCES', GAME_CONFIG.STARTING_RESOURCES, 'Starting Resources', 0, 5000);
      html += createConfigInput('STARTING_CIVILIANS', GAME_CONFIG.STARTING_CIVILIANS, 'Starting Civilians', 1, 100);
      html += '</div>';
      
      // Fog of War
      html += '<div style="border: 1px solid rgba(217, 164, 65, 0.3); padding: 12px; border-radius: 4px;">';
      html += '<div style="color: #d9a441; font-weight: bold; margin-bottom: 8px;">👁️ Fog of War</div>';
      html += `<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px;">
        <label style="flex: 1; color: #9a9f8e;">Fog of War Enabled:</label>
        <input type="checkbox" id="cfg-FOG_OF_WAR_ENABLED" ${GAME_CONFIG.FOG_OF_WAR_ENABLED ? 'checked' : ''} onchange="applyConfigChange('FOG_OF_WAR_ENABLED', this.checked)">
      </div>`;
      html += '<div style="font-size: 10px; color: #5f6459; margin-bottom: 8px;">Vision Ranges (tiles):</div>';
      html += createConfigInput('UNIT_VISION_RANGE_civilian', GAME_CONFIG.UNIT_VISION_RANGE.civilian, 'Civilian Vision', 1, 10);
      html += createConfigInput('UNIT_VISION_RANGE_soldier', GAME_CONFIG.UNIT_VISION_RANGE.soldier, 'Soldier Vision', 1, 10);
      html += createConfigInput('UNIT_VISION_RANGE_tank', GAME_CONFIG.UNIT_VISION_RANGE.tank, 'Tank Vision', 1, 10);
      html += createConfigInput('BUILDING_VISION_RANGE_radar', GAME_CONFIG.BUILDING_VISION_RANGE.radar, 'Radar Vision', 1, 15);
      html += createConfigInput('BUILDING_VISION_RANGE_residence', GAME_CONFIG.BUILDING_VISION_RANGE.residence, 'Residence Vision', 1, 10);
      html += '</div>';
      
      html += '</div>';
      content.innerHTML = html;
      modal.showModal();
    }
    
    function createConfigInput(key, value, label, min, max) {
      const type = typeof value === 'number' ? 'number' : 'text';
      const step = key.includes('Speed') ? '0.001' : '1';
      return `
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;">
          <label style="flex: 1; color: #9a9f8e;">${label}:</label>
          <input type="number" id="cfg-${key}" value="${value}" min="${min}" max="${max}" step="${step}" 
                 style="width: 80px; padding: 4px; background: rgba(217, 164, 65, 0.1); border: 1px solid #d9a441; color: #d9a441;"
                 onchange="applyConfigChange('${key}', this.value)">
        </div>
      `;
    }
    
    function applyConfigChange(key, value) {
      const numValue = parseFloat(value);
      
      // Handle nested config updates
      if (key === 'TILE_SIZE') {
        GAME_CONFIG.TILE_SIZE = numValue;
        const TILE_SIZE = numValue;
      } else if (key === 'TICK_RATE') {
        GAME_CONFIG.TICK_RATE = numValue;
        const TICK_RATE = numValue;
      } else if (key.startsWith('BUILDING_COSTS_')) {
        const building = key.replace('BUILDING_COSTS_', '');
        GAME_CONFIG.BUILDING_COSTS[building] = numValue;
      } else if (key.startsWith('UNIT_COSTS_')) {
        const unit = key.replace('UNIT_COSTS_', '');
        GAME_CONFIG.UNIT_COSTS[unit] = numValue;
      } else if (key.startsWith('UNIT_STATS_soldier_')) {
        const stat = key.replace('UNIT_STATS_soldier_', '');
        if (stat === 'speed') {
          GAME_CONFIG.UNIT_STATS.soldier.speed = numValue / 1000;
        } else {
          GAME_CONFIG.UNIT_STATS.soldier[stat] = numValue;
        }
      } else if (key.startsWith('UNIT_STATS_tank_')) {
        const stat = key.replace('UNIT_STATS_tank_', '');
        if (stat === 'speed') {
          GAME_CONFIG.UNIT_STATS.tank.speed = numValue / 1000;
        } else {
          GAME_CONFIG.UNIT_STATS.tank[stat] = numValue;
        }
      } else if (key === 'CIVILIAN_GROWTH_TICKS') {
        GAME_CONFIG.CIVILIAN_GROWTH_TICKS = numValue;
      } else if (key === 'MAX_CIVILIANS_PER_RESIDENCE') {
        GAME_CONFIG.MAX_CIVILIANS_PER_RESIDENCE = numValue;
      } else if (key === 'STARTING_RESOURCES') {
        GAME_CONFIG.STARTING_RESOURCES = numValue;
      } else if (key === 'STARTING_CIVILIANS') {
        GAME_CONFIG.STARTING_CIVILIANS = numValue;
      } else if (key === 'FOG_OF_WAR_ENABLED') {
        GAME_CONFIG.FOG_OF_WAR_ENABLED = value === 'true' || value === true;
        refreshDerivedState();
      } else if (key.startsWith('UNIT_VISION_RANGE_')) {
        const unit = key.replace('UNIT_VISION_RANGE_', '');
        GAME_CONFIG.UNIT_VISION_RANGE[unit] = numValue;
        refreshDerivedState();
      } else if (key.startsWith('BUILDING_VISION_RANGE_')) {
        const building = key.replace('BUILDING_VISION_RANGE_', '');
        GAME_CONFIG.BUILDING_VISION_RANGE[building] = numValue;
        refreshDerivedState();
      }
      
      updateUI();
      updateBuildMenuDisplay();
      console.log(`Updated ${key} to ${value}`);
    }
    
    function resetGameConfig() {
      if (confirm('Reset all settings to defaults? This will reload the game.')) {
        location.reload();
      }
    }
    
    function closeSettingsPanel() {
      document.getElementById('settings-modal').close();
    }

    // ==========================================
    // 1. GAME CONFIGURATION - EASILY ADJUSTABLE
    // ==========================================
    const GAME_CONFIG = {
      // UI & Display
      TILE_SIZE: 64,           // Pixels per grid square
      TICK_RATE: 1000,         // Economy tick interval (ms)
      
      // BUILDINGS
      BUILDING_COSTS: {
        residence: 100,
        barracks: 200,
        armory: 500,
        radar: 250,
        mine: 0
      },
      
      BUILDING_STATS: {
        residence: { capacity: 10, vision: 0 },
        barracks: { capacity: 10, vision: 0 },
        armory: { capacity: 10, vision: 0 },
        radar: { capacity: 10, vision: 4 },
        mine: { capacity: 10, vision: 0 }
      },
      
      // UNITS - Costs (resource + 1 civilian)
      UNIT_COSTS: {
        soldier: 50,
        tank: 300,
        civilian: 0  // No cost, auto-spawned
      },
      
      // UNITS - Stats
      UNIT_STATS: {
        soldier: {
          hp: 1,
          maxHp: 1,
          speed: 0.025,        // Tiles per tick frame
          meleeDmg: 1,
          cannonDmg: 0
        },
        tank: {
          hp: 10,
          maxHp: 10,
          speed: 0.015,        // Tiles per tick frame
          meleeDmg: 10,
          cannonDmg: 5
        },
        civilian: {
          hp: 1,
          maxHp: 1,
          speed: 0.02,         // Tiles per tick frame
          meleeDmg: 0,
          cannonDmg: 0
        }
      },
      
      // ECONOMY & PRODUCTION
      CIVILIAN_GROWTH_TICKS: 5,         // Ticks per new civilian spawn
      MINING_RATE_PER_TICK: 1/60,      // Progress per miner per tick
      MAX_CIVILIANS_PER_RESIDENCE: 10,  // Hard capacity limit
      STARTING_RESOURCES: 0,
      STARTING_CIVILIANS: 15,
      STARTING_RESIDENCES: 2,
      
      // GAMEPLAY
      INITIAL_CAMERA_ZOOM: 1.5,
      
      // FOG OF WAR
      FOG_OF_WAR_ENABLED: true,
      UNIT_VISION_RANGE: {
        civilian: 2,
        soldier: 3,
        tank: 4
      },
      BUILDING_VISION_RANGE: {
        residence: 2,
        barracks: 2,
        armory: 2,
        radar: 6,   // Radar has superior vision
        mine: 1
      },
      FOG_SHROUD_COLOR: 'rgba(11, 13, 10, 0.7)',  // Dark fog overlay
      EXPLORED_COLOR: 'rgba(60, 70, 60, 0.3)'     // Slightly visible explored areas
    };
    
    // Convenience constants (derived from config)
    const TILE_SIZE = GAME_CONFIG.TILE_SIZE;
    const TICK_RATE = GAME_CONFIG.TICK_RATE;

    const ASSETS = {
      tank: "tank.webp",
      soldier: "soldier.png",
      civilian: "civilian.webp",
      mine: "mine.webp",
      residence: "residence.webp",
      barracks: "barracks.webp",
      armory: "armory.png",
      radar: "radar.webp",
      resource: "resources.webp"
    };

    // Dynamic building info that reads from GAME_CONFIG
    function getBuildingInfo(type) {
      const cost = GAME_CONFIG.BUILDING_COSTS[type] || 0;
      const stats = GAME_CONFIG.BUILDING_STATS[type] || { capacity: 10, vision: 0 };
      const soldierCost = GAME_CONFIG.UNIT_COSTS.soldier || 50;
      const tankCost = GAME_CONFIG.UNIT_COSTS.tank || 300;
      const civGrowthTicks = GAME_CONFIG.CIVILIAN_GROWTH_TICKS || 5;
      const maxCap = GAME_CONFIG.MAX_CIVILIANS_PER_RESIDENCE || 10;
      
      const baseInfo = {
        residence: {
          title: "Residence",
          desc: "Increases civilian population capacity and passively spawns new civilians.",
          stats: `Cost: ${cost}g | Housing Cap: +${stats.capacity} Civilians | Growth: 1 per ${civGrowthTicks} tick(s) | Garrison: ${stats.capacity} Units`
        },
        barracks: {
          title: "Barracks",
          desc: "Military recruitment hub. Converts available civilians into Soldiers.",
          stats: `Cost: ${cost}g | Train: ${soldierCost}g + 1 Civilian | Garrison: ${stats.capacity} Units`
        },
        armory: {
          title: "Armory",
          desc: "Heavy weapons factory. Converts available civilians into armored Tanks.",
          stats: `Cost: ${cost}g | Train: ${tankCost}g + 1 Civilian | Garrison: ${stats.capacity} Units`
        },
        radar: {
          title: "Radar Station",
          desc: "Tactical reconnaissance installation providing strategic vision over adjacent tiles.",
          stats: `Cost: ${cost}g | Vision Range: ${stats.vision} Tiles | Garrison: ${stats.capacity} Units`
        },
        mine: {
          title: "Resource Mine",
          desc: "Resource extraction node. Generates gold when civilians mine or garrison inside.",
          stats: `Yield: ~${Math.round(60 / (1 / GAME_CONFIG.MINING_RATE_PER_TICK))}g/min per miner | Worker Cap: ${stats.capacity} Civilians`
        }
      };
      
      return baseInfo[type] || baseInfo.residence;
    }

    // Dynamic unit info that reads from GAME_CONFIG
    function getUnitInfo(type) {
      const stats = GAME_CONFIG.UNIT_STATS[type] || GAME_CONFIG.UNIT_STATS.soldier;
      const cost = GAME_CONFIG.UNIT_COSTS[type] || 0;
      const costText = cost > 0 ? `${cost}g + 1 Civ` : 'Auto-spawn';
      
      return {
        title: type.toUpperCase(),
        cost: costText,
        hp: stats.hp,
        maxHp: stats.maxHp,
        speed: stats.speed,
        meleeDmg: stats.meleeDmg,
        cannonDmg: stats.cannonDmg,
        stats: `HP: ${stats.hp} | Speed: ${(stats.speed * 100).toFixed(1)} | Melee: ${stats.meleeDmg}${stats.cannonDmg > 0 ? ` | Cannon: ${stats.cannonDmg}` : ''}`
      };
    }

    const IMAGES = {};

    function loadAssets() {
      Object.keys(ASSETS).forEach(key => {
        const img = new Image();
        img.src = ASSETS[key];
        img.onload = () => { 
          IMAGES[key] = img; 
          updateUIcons();
        };
        img.onerror = () => { IMAGES[key] = null; };
      });
    }

    function updateUIcons() {
      const iconRes = document.getElementById('icon-res');
      const iconCiv = document.getElementById('icon-civ');
      const iconTank = document.getElementById('icon-tank');
      const iconSoldier = document.getElementById('icon-soldier');
      if (iconRes) iconRes.src = ASSETS.resource;
      if (iconCiv) iconCiv.src = ASSETS.civilian;
      if (iconTank) iconTank.src = ASSETS.tank;
      if (iconSoldier) iconSoldier.src = ASSETS.soldier;

      document.querySelectorAll('.btn-icon-residence').forEach(el => el.src = ASSETS.residence);
      document.querySelectorAll('.btn-icon-barracks').forEach(el => el.src = ASSETS.barracks);
      document.querySelectorAll('.btn-icon-armory').forEach(el => el.src = ASSETS.armory);
      document.querySelectorAll('.btn-icon-radar').forEach(el => el.src = ASSETS.radar);
    }

    loadAssets();

    function resumeProgressFromBackground() {
      const elapsed = Date.now() - (state.lastSavedAt || Date.now());
      if (elapsed > 0) {
        applyOfflineProgress(elapsed);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        syncPersistenceTimestamp();
        saveGameState();
      } else {
        resumeProgressFromBackground();
      }
    });

    window.addEventListener('pagehide', () => {
      syncPersistenceTimestamp();
      saveGameState();
    });

    window.addEventListener('beforeunload', () => {
      syncPersistenceTimestamp();
      saveGameState();
    });

    // Dialog Utility System
    function showDialog(title, text, actions = []) {
      const dialog = document.getElementById('game-modal');
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = text;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';

      if (actions.length === 0) {
        actions.push({ label: 'OK', onClick: () => {} });
      }

      actions.forEach(action => {
        const btn = document.createElement('button');
        btn.innerText = action.label;
        btn.onclick = () => {
          if (action.onClick) action.onClick();
          dialog.close();
        };
        actionsEl.appendChild(btn);
      });

      dialog.showModal();
    }

    function updateBuildMenuDisplay() {
      const buildMenu = document.getElementById('build-menu');
      if (!buildMenu) return;
      
      const buttons = buildMenu.querySelectorAll('button:not(:last-child)');
      const buildings = ['residence', 'barracks', 'armory', 'radar'];
      
      buttons.forEach((btn, idx) => {
        const buildType = buildings[idx];
        const cost = GAME_CONFIG.BUILDING_COSTS[buildType] || 0;
        const tag = btn.querySelector('.shortcut-tag');
        if (tag) {
          tag.innerText = `(${cost}g)`;
        }
      });
    }
    
    function closeDialog() {
      document.getElementById('game-modal').close();
    }

    // ==========================================
    // 2. STATE MANAGEMENT
    // ==========================================
    const SAVE_KEY = 'grid-rts-engine-save-v1';
    const CATCH_UP_CAP_MS = 1000 * 60 * 60 * 12; // Keep recovery work sane if the tab was gone for ages.
    let idCounter = 1;
    let civilianNumberCounter = 0; // Proper civilian numbering system

    const state = {
      resources: GAME_CONFIG.STARTING_RESOURCES,
      civilians: GAME_CONFIG.STARTING_CIVILIANS,
      civilianCap: 0, // Capped strictly based on total Residence housing capacity
      civilianGrowthCounter: 0,
      civilianNumberCounter: 0, // Track next civilian number
      lastSavedAt: Date.now(),

      // Entities
      units: [],
      buildings: [],

      // Interaction State
      selectedEntityId: null,
      targetTile: null, // Selected target destination tile {x, y}
      hoveredTile: { x: 0, y: 0 },
      buildMode: null, // 'residence', etc.

      // Camera
      camera: {
        x: 0,
        y: 0,
        zoom: 1.0,
        isDragging: false,
        dragButton: null,
        dragStart: { x: 0, y: 0 },
        dragOrigin: { x: 0, y: 0 },
        dragDistance: 0
      },

      // Faction
      playerFaction: 'blue',
      
      // Fog of War
      exploredTiles: new Set(),  // Tiles ever seen
      visibleTiles: new Set()    // Tiles currently visible
    };

    function refreshDerivedState() {
      const numResidences = state.buildings.filter(b => b.type === 'residence' && b.faction === 'blue').length;
      state.civilianCap = numResidences * 10;
      state.civilians = state.units.filter(u => u.type === 'civilian').length;
      updateFogOfWar();
    }

    function updateFogOfWar() {
      if (!GAME_CONFIG.FOG_OF_WAR_ENABLED) {
        // No fog: everything is visible
        state.visibleTiles.clear();
        state.exploredTiles.clear();
        return;
      }

      const newVisibleTiles = new Set();

      // Calculate vision from all player units
      state.units.forEach(u => {
        if (u.faction !== 'blue') return;
        const visionRange = GAME_CONFIG.UNIT_VISION_RANGE[u.type] || 2;
        const tx = Math.floor(u.x);
        const ty = Math.floor(u.y);
        
        // Add all tiles within vision range
        for (let dx = -visionRange; dx <= visionRange; dx++) {
          for (let dy = -visionRange; dy <= visionRange; dy++) {
            const key = `${tx + dx},${ty + dy}`;
            newVisibleTiles.add(key);
            state.exploredTiles.add(key);
          }
        }
      });

      // Calculate vision from all player buildings
      state.buildings.forEach(b => {
        if (b.faction !== 'blue') return;
        const visionRange = GAME_CONFIG.BUILDING_VISION_RANGE[b.type] || 1;
        const tx = b.tileX;
        const ty = b.tileY;
        
        // Add all tiles within vision range
        for (let dx = -visionRange; dx <= visionRange; dx++) {
          for (let dy = -visionRange; dy <= visionRange; dy++) {
            const key = `${tx + dx},${ty + dy}`;
            newVisibleTiles.add(key);
            state.exploredTiles.add(key);
          }
        }
      });

      state.visibleTiles = newVisibleTiles;
    }

    function isTileVisible(x, y) {
      if (!GAME_CONFIG.FOG_OF_WAR_ENABLED) return true;
      const key = `${Math.floor(x)},${Math.floor(y)}`;
      return state.visibleTiles.has(key);
    }

    function isTileExplored(x, y) {
      if (!GAME_CONFIG.FOG_OF_WAR_ENABLED) return true;
      const key = `${Math.floor(x)},${Math.floor(y)}`;
      return state.exploredTiles.has(key);
    }

    function syncPersistenceTimestamp() {
      state.lastSavedAt = Date.now();
    }

    function saveGameState() {
      try {
        const payload = {
          resources: state.resources,
          civilians: state.civilians,
          civilianCap: state.civilianCap,
          civilianGrowthCounter: state.civilianGrowthCounter,
          civilianNumberCounter: civilianNumberCounter,
          units: state.units,
          buildings: state.buildings,
          selectedEntityId: state.selectedEntityId,
          targetTile: state.targetTile,
          hoveredTile: state.hoveredTile,
          buildMode: state.buildMode,
          camera: state.camera,
          playerFaction: state.playerFaction,
          lastSavedAt: state.lastSavedAt,
          idCounter
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      } catch (err) {
        console.warn('Save failed:', err);
      }
    }

    function loadGameState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;

        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.units) || !Array.isArray(data.buildings)) return false;

        state.resources = Number(data.resources) || 0;
        state.civilians = Number(data.civilians) || 0;
        state.civilianCap = Number(data.civilianCap) || 0;
        state.civilianGrowthCounter = Number(data.civilianGrowthCounter) || 0;
        state.units = data.units;
        state.buildings = data.buildings;
        state.selectedEntityId = null;
        state.targetTile = null;
        state.hoveredTile = data.hoveredTile || { x: 0, y: 0 };
        state.buildMode = null;
        state.camera = { ...state.camera, ...(data.camera || {}) };
        state.playerFaction = data.playerFaction || 'blue';
        state.lastSavedAt = Number(data.lastSavedAt) || Date.now();

        const maxId = Math.max(
          0,
          ...state.units.map(u => Number(u.id) || 0),
          ...state.buildings.map(b => Number(b.id) || 0)
        );
        idCounter = Math.max(maxId + 1, Number(data.idCounter) || 1);
        civilianNumberCounter = Number(data.civilianNumberCounter) || state.units.filter(u => u.type === 'civilian').length;

        refreshDerivedState();
        return true;
      } catch (err) {
        console.warn('Load failed:', err);
        return false;
      }
    }

    function processEconomyTick() {
      // Process mining for each mine individually
      state.buildings.forEach(b => {
        if (b.type === 'mine') {
          const activeMiners = state.units.filter(u => u.type === 'civilian' && (u.assignedMineId === b.id || u.garrisonedBuildingId === b.id)).length;
          b.assignedCivilians = activeMiners;
          
          // Add mining progress for this mine
          const mineResourceRate = activeMiners * GAME_CONFIG.MINING_RATE_PER_TICK;
          b.miningProgress += mineResourceRate;
          
          // When progress >= 1, harvest a resource and update global resources
          if (b.miningProgress >= 1) {
            const harvestedAmount = Math.floor(b.miningProgress);
            state.resources += harvestedAmount;
            b.miningProgress -= harvestedAmount;
          }
        }
      });

      refreshDerivedState();

      // Process civilian growth for each residence individually
      const residences = state.buildings.filter(b => b.type === 'residence' && b.faction === 'blue');
      
      residences.forEach(res => {
        const civiliansInRes = state.units.filter(u => u.type === 'civilian' && u.garrisonedBuildingId === res.id).length;
        const maxPerResidence = GAME_CONFIG.MAX_CIVILIANS_PER_RESIDENCE;
        
        // Only grow if:
        // 1. This residence has capacity (civs in it < max, meaning it can hold more)
        // 2. We haven't hit global cap
        // If civs die, this residence can produce more to fill back up
        if (civiliansInRes < maxPerResidence && state.civilians < state.civilianCap) {
          res.growthProgress++;
          
          if (res.growthProgress >= GAME_CONFIG.CIVILIAN_GROWTH_TICKS) {
            // Spawn a civilian into this residence
            const newCiv = createUnit('civilian', res.tileX, res.tileY, 'blue');
            newCiv.garrisonedBuildingId = res.id;
            state.units.push(newCiv);
            res.growthProgress = 0;
            refreshDerivedState();
          }
        } else if (civiliansInRes >= maxPerResidence || state.civilians >= state.civilianCap) {
          // Halt growth if full or global cap hit
          res.growthProgress = 0;
        }
      });
      
      // Clear old global counter (kept for backwards compatibility)
      state.civilianGrowthCounter = 0;

      syncPersistenceTimestamp();
      saveGameState();
      updateUI();
    }

    function applyOfflineProgress(elapsedMs) {
      const cappedMs = Math.max(0, Math.min(elapsedMs, CATCH_UP_CAP_MS));
      if (cappedMs <= 0) return;

      // Advance movement/combat in one go, then apply the matching number of economy ticks.
      updateCombatAndMovement(cappedMs);

      const economyTicks = Math.floor(cappedMs / TICK_RATE);
      for (let i = 0; i < economyTicks; i++) {
        processEconomyTick();
      }

      state.lastSavedAt = Date.now();
      saveGameState();
    }

    function initGame() {
      const loaded = loadGameState();
      if (loaded) {
        const elapsed = Date.now() - state.lastSavedAt;
        applyOfflineProgress(elapsed);
        updateUIcons();
        updateUI();
        return;
      }

      // Starting Residences
      const res1 = createBuilding('residence', 2, 2, 'blue');
      const res2 = createBuilding('residence', 4, 2, 'blue');
      state.buildings.push(res1, res2);

      // Start all 15 initial Civilians housed directly inside the starting Residences
      for (let i = 0; i < 15; i++) {
        const targetRes = (i < 10) ? res1 : res2;
        const civ = createUnit('civilian', targetRes.tileX, targetRes.tileY, 'blue');
        civ.garrisonedBuildingId = targetRes.id;
        state.units.push(civ);
      }

      // Procedurally / Naturally Generated Mines across the map
      const numNaturalMines = 7;
      for (let i = 0; i < numNaturalMines; i++) {
        let rx, ry, attempts = 0;
        do {
          rx = Math.floor(Math.random() * 24) - 4;
          ry = Math.floor(Math.random() * 24) - 4;
          attempts++;
        } while (
          attempts < 50 && (
            state.buildings.some(b => b.tileX === rx && b.tileY === ry) ||
            Math.hypot(rx - 3, ry - 2) < 4 // Keep away from starting area
          )
        );
        state.buildings.push(createBuilding('mine', rx, ry, 'neutral'));
      }

      // Center camera on starting base
      state.camera.x = - (3 * TILE_SIZE - window.innerWidth / 2);
      state.camera.y = - (3 * TILE_SIZE - window.innerHeight / 2);

      refreshDerivedState();
      syncPersistenceTimestamp();
      saveGameState();
      updateUIcons();
      updateUI();
    }

    // Entity Factories

    function createUnit(type, x, y, faction = 'blue') {
      const stats = GAME_CONFIG.UNIT_STATS[type] || GAME_CONFIG.UNIT_STATS.soldier;
      const tileX = Math.floor(x);
      const tileY = Math.floor(y);

      const unit = {
        id: idCounter++,
        entityType: 'unit',
        type: type, // 'soldier' | 'tank' | 'civilian'
        faction: faction,
        x: tileX, // Perfect integer tile coordinate
        y: tileY,
        targetX: tileX,
        targetY: tileY,
        hp: stats.hp,
        maxHp: stats.maxHp,
        speed: stats.speed,        // Tiles per tick frame
        meleeDmg: stats.meleeDmg,
        // Tank Cannon Mechanics
        cannonDmg: stats.cannonDmg,
        cannonCooldown: 0,         // Tick counter
        fireControl: 'aggressive', // 'aggressive' | 'ignore_infantry' | 'ignore_buildings' | 'prioritize_buildings' | 'hold_fire'
        selected: false,
        // Structure Entry & Mine Mechanics
        assignedMineId: null,
        targetMineId: null,
        garrisonedBuildingId: null, // Can enter ANY structure
        targetBuildingId: null
      };

      // Assign proper civilian numbering
      if (type === 'civilian') {
        unit.civilianNumber = ++civilianNumberCounter;
      }

      return unit;
    }

    function createBuilding(type, tileX, tileY, faction = 'blue') {
      const cost = GAME_CONFIG.BUILDING_COSTS[type] || 0;
      const stats = GAME_CONFIG.BUILDING_STATS[type] || { capacity: 10, vision: 0 };
      
      const base = {
        id: idCounter++,
        entityType: 'building',
        type: type,
        faction: faction,
        tileX: tileX,
        tileY: tileY,
        hp: 20,
        maxHp: 20,
        assignedCivilians: 0,
        trainingQueue: [],
        capacity: stats.capacity,
        vision: stats.vision,
        cost: cost,
        capBonus: (type === 'residence') ? stats.capacity : 0,
        miningProgress: 0, // For mines: tracks fractional resource generation (0-1)
        growthProgress: 0  // For residences: tracks civilian growth progress (0-5)
      };

      return base;
    }

    // ==========================================
    // 3. CANVAS & CAMERA SYSTEM
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function worldToScreen(wx, wy) {
      return {
        x: (wx * TILE_SIZE + state.camera.x) * state.camera.zoom,
        y: (wy * TILE_SIZE + state.camera.y) * state.camera.zoom
      };
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx / state.camera.zoom - state.camera.x) / TILE_SIZE,
        y: (sy / state.camera.zoom - state.camera.y) / TILE_SIZE
      };
    }

    // ==========================================
    // 4. COMBAT & MOVEMENT
    // ==========================================
    function updateCombatAndMovement(deltaTime) {
      state.units.forEach(unit => {
        // Skip movement and combat processing for garrisoned units inside structures
        if (unit.garrisonedBuildingId) return;

        if (unit.x !== unit.targetX || unit.y !== unit.targetY) {
          const dx = unit.targetX - unit.x;
          const dy = unit.targetY - unit.y;
          const dist = Math.hypot(dx, dy);

          const movementStep = unit.speed * (deltaTime / (1000 / 60));

          if (dist < movementStep) {
            unit.x = unit.targetX;
            unit.y = unit.targetY;

            // On arriving at a target structure, enter/garrison inside if capacity permits
            if (unit.targetBuildingId) {
              const bld = state.buildings.find(b => b.id === unit.targetBuildingId);
              if (bld) {
                const garrisonedCount = state.units.filter(u => u.garrisonedBuildingId === bld.id).length;
                const maxCap = bld.capacity || bld.capBonus || 10;

                if (garrisonedCount < maxCap) {
                  unit.garrisonedBuildingId = bld.id;
                  if (bld.type === 'mine' && unit.type === 'civilian') {
                    unit.assignedMineId = bld.id;
                  }
                } else {
                  showDialog("Structure Full", `${bld.type.toUpperCase()} #${bld.id} has reached maximum garrison capacity (${maxCap}).`);
                }
              }
              unit.targetBuildingId = null;
            }

            // On arriving at a mine target for civilians
            if (unit.type === 'civilian' && unit.targetMineId) {
              const mine = state.buildings.find(b => b.id === unit.targetMineId);
              if (mine) {
                unit.assignedMineId = mine.id;
              }
              unit.targetMineId = null;
            }
          } else {
            unit.x += (dx / dist) * movementStep;
            unit.y += (dy / dist) * movementStep;
          }

          const currentTileX = Math.floor(unit.x);
          const currentTileY = Math.floor(unit.y);

          // Support multi-unit combat on the same tile
          state.units.forEach(enemy => {
            if (!enemy.garrisonedBuildingId && enemy.faction !== unit.faction && 
                Math.floor(enemy.x) === currentTileX && 
                Math.floor(enemy.y) === currentTileY) {
              
              enemy.hp -= unit.meleeDmg * (deltaTime / 1000);
              unit.hp -= enemy.meleeDmg * (deltaTime / 1000);
            }
          });
        }

        if (unit.type === 'tank' && unit.fireControl !== 'hold_fire') {
          unit.cannonCooldown += deltaTime;
          if (unit.cannonCooldown >= 10000) {
            const target = findTankTarget(unit);
            if (target) {
              target.hp -= unit.cannonDmg;
              unit.cannonCooldown = 0;
              drawCannonEffect(unit, target);
            }
          }
        }
      });

      state.units = state.units.filter(u => u.hp > 0);
      state.buildings = state.buildings.filter(b => b.hp > 0);
    }

    function findTankTarget(tank) {
      const tankTileX = Math.floor(tank.x);
      const tankTileY = Math.floor(tank.y);
      const candidates = [];

      if (tank.fireControl !== 'ignore_infantry') {
        state.units.forEach(u => {
          if (!u.garrisonedBuildingId && u.faction !== tank.faction) {
            const ux = Math.floor(u.x);
            const uy = Math.floor(u.y);
            if (Math.abs(ux - tankTileX) <= 1 && Math.abs(uy - tankTileY) <= 1) {
              candidates.push({ entity: u, type: 'unit' });
            }
          }
        });
      }

      if (tank.fireControl !== 'ignore_buildings') {
        state.buildings.forEach(b => {
          if (b.faction !== tank.faction) {
            if (Math.abs(b.tileX - tankTileX) <= 1 && Math.abs(b.tileY - tankTileY) <= 1) {
              candidates.push({ entity: b, type: 'building' });
            }
          }
        });
      }

      if (candidates.length === 0) return null;

      if (tank.fireControl === 'prioritize_buildings') {
        const building = candidates.find(c => c.type === 'building');
        if (building) return building.entity;
      }

      return candidates[0].entity;
    }

    let shotFlares = [];
    function drawCannonEffect(from, to) {
      const startX = Math.floor(from.x) + 0.5;
      const startY = Math.floor(from.y) + 0.5;
      const endX = (to.x !== undefined ? Math.floor(to.x) : to.tileX) + 0.5;
      const endY = (to.y !== undefined ? Math.floor(to.y) : to.tileY) + 0.5;
      
      shotFlares.push({
        x1: startX, y1: startY,
        x2: endX, y2: endY,
        life: 1.0
      });
    }

    // ==========================================
    // 5. ECONOMY & TIME TICK
    // ==========================================
    setInterval(processEconomyTick, TICK_RATE);

    // ==========================================
    // 6. INPUT HANDLING & SELECTION
    //    Left click  -> select entity (click same tile again to cycle a stack); places buildings in build mode
    //    Left drag   -> pan camera
    //    Right click -> issue move / target order to the selected entity
    //    Middle drag -> pan camera (alt. to left-drag)
    //    WASD/Arrows -> pan camera
    //    Scroll      -> zoom toward cursor
    //    Escape      -> cancel build mode, else deselect
    // ==========================================
    const DRAG_THRESHOLD = 5; // px of movement before a left-click becomes a pan instead of a selection
    let mouseDownInfo = null;
    let isPanningLeft = false;
    const keysHeld = new Set();
    const PAN_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];

    function setCursor(style) {
      canvas.style.cursor = style;
    }

    function updateCursorForMode() {
      setCursor(state.buildMode ? 'crosshair' : 'default');
    }

    canvas.addEventListener('mousedown', (e) => {
      const world = screenToWorld(e.clientX, e.clientY);
      const tileX = Math.floor(world.x);
      const tileY = Math.floor(world.y);

      if (e.button === 0) {
        if (state.buildMode) {
          placeBuilding(state.buildMode, tileX, tileY);
          state.buildMode = null;
          updateCursorForMode();
          return;
        }
        // Don't act immediately - wait to see if this turns into a drag-to-pan
        mouseDownInfo = { tileX, tileY };
        isPanningLeft = false;

      } else if (e.button === 1) {
        // Middle Click: Camera Pan Dragging
        state.camera.isDragging = true;
        state.camera.dragStart = { x: e.clientX, y: e.clientY };
        setCursor('grabbing');

      } else if (e.button === 2) {
        // Right Click: Issue Target Tile / Move / Enter command to the selected entity
        if (state.buildMode) {
          state.buildMode = null;
          updateCursorForMode();
          return;
        }

        const selected = getSelectedEntity();
        if (selected) {
          state.targetTile = { x: tileX, y: tileY };

          // Direct move / enter structure command if selected entity is a single deployed unit
          if (selected.entityType === 'unit' && !selected.garrisonedBuildingId) {
            selected.targetX = tileX;
            selected.targetY = tileY;

            const targetBld = state.buildings.find(b => b.tileX === tileX && b.tileY === tileY);
            if (targetBld) {
              selected.targetBuildingId = targetBld.id;
              if (targetBld.type === 'mine' && selected.type === 'civilian') {
                selected.targetMineId = targetBld.id;
              } else {
                selected.targetMineId = null;
              }
            } else {
              selected.targetBuildingId = null;
              selected.targetMineId = null;
              selected.assignedMineId = null;
            }
          }
          updateUI();
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const world = screenToWorld(e.clientX, e.clientY);
      state.hoveredTile = { x: Math.floor(world.x), y: Math.floor(world.y) };

      if (state.camera.isDragging) {
        const dx = e.clientX - state.camera.dragStart.x;
        const dy = e.clientY - state.camera.dragStart.y;
        state.camera.x += dx / state.camera.zoom;
        state.camera.y += dy / state.camera.zoom;
        state.camera.dragStart = { x: e.clientX, y: e.clientY };
      } else if (mouseDownInfo) {
        if (mouseDownInfo.screenX === undefined) {
          mouseDownInfo.screenX = e.clientX;
          mouseDownInfo.screenY = e.clientY;
        }
        const totalDx = e.clientX - mouseDownInfo.screenX;
        const totalDy = e.clientY - mouseDownInfo.screenY;
        if (isPanningLeft || Math.hypot(totalDx, totalDy) > DRAG_THRESHOLD) {
          if (!isPanningLeft) {
            isPanningLeft = true;
            setCursor('grabbing');
          }
          state.camera.x += e.movementX / state.camera.zoom;
          state.camera.y += e.movementY / state.camera.zoom;
        }
      }

      updateUI();
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0 && mouseDownInfo && !isPanningLeft) {
        // A genuine click, no drag: select / cycle the entity on that tile
        const { tileX, tileY } = mouseDownInfo;
        const unitsOnTile = state.units.filter(u => !u.garrisonedBuildingId && Math.floor(u.x) === tileX && Math.floor(u.y) === tileY);

        if (unitsOnTile.length > 0) {
          const currIndex = unitsOnTile.findIndex(u => u.id === state.selectedEntityId);
          if (currIndex !== -1) {
            const nextUnit = unitsOnTile[(currIndex + 1) % unitsOnTile.length];
            state.selectedEntityId = nextUnit.id;
          } else {
            state.selectedEntityId = unitsOnTile[0].id;
          }
        } else {
          const clickedBuilding = state.buildings.find(b => b.tileX === tileX && b.tileY === tileY);
          state.selectedEntityId = clickedBuilding ? clickedBuilding.id : null;
        }

        state.targetTile = null;
        updateUI();
      }

      mouseDownInfo = null;
      isPanningLeft = false;
      state.camera.isDragging = false;
      updateCursorForMode();
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.max(0.4, Math.min(2.5, state.camera.zoom * zoomFactor));

      // Zoom toward the cursor so the tile under the mouse stays put, instead of drifting
      const worldBefore = screenToWorld(e.clientX, e.clientY);
      state.camera.zoom = newZoom;
      const worldAfter = screenToWorld(e.clientX, e.clientY);
      state.camera.x += (worldAfter.x - worldBefore.x) * TILE_SIZE;
      state.camera.y += (worldAfter.y - worldBefore.y) * TILE_SIZE;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.buildMode) {
          state.buildMode = null;
          updateCursorForMode();
        } else {
          deselectEntity();
        }
        return;
      }
      const k = e.key.toLowerCase();
      if (PAN_KEYS.includes(k)) keysHeld.add(k);
    });

    window.addEventListener('keyup', (e) => {
      keysHeld.delete(e.key.toLowerCase());
    });

    const PAN_SPEED = 0.7; // world px per ms at zoom 1.0
    function applyKeyboardPan(deltaTime) {
      if (keysHeld.size === 0) return;
      const speed = (PAN_SPEED * deltaTime) / state.camera.zoom;
      if (keysHeld.has('w') || keysHeld.has('arrowup')) state.camera.y += speed;
      if (keysHeld.has('s') || keysHeld.has('arrowdown')) state.camera.y -= speed;
      if (keysHeld.has('a') || keysHeld.has('arrowleft')) state.camera.x += speed;
      if (keysHeld.has('d') || keysHeld.has('arrowright')) state.camera.x -= speed;
    }

    // ==========================================
    // 7. ACTIONS & COMMANDS
    // ==========================================
    function deselectEntity() {
      state.selectedEntityId = null;
      state.targetTile = null;
      updateUI();
    }

    function setBuildMode(structureType) {
      state.buildMode = structureType;
      updateCursorForMode();
    }

    function placeBuilding(type, tileX, tileY) {
      const costs = { residence: 100, barracks: 200, armory: 500, radar: 250 };
      const cost = costs[type];

      if (state.resources < cost) {
        showDialog("Resource Deficit", `Insufficient resources to construct ${type.toUpperCase()}. Required: ${cost}g.`);
        return;
      }

      const occupied = state.buildings.some(b => b.tileX === tileX && b.tileY === tileY);
      if (occupied) return;

      state.resources -= cost;
      state.buildings.push(createBuilding(type, tileX, tileY, 'blue'));
      updateUI();
    }

    function trainUnit(building, unitType, count = 1, targetTile = null) {
      const costPerUnit = GAME_CONFIG.UNIT_COSTS[unitType] || 0;
      let trainedCount = 0;

      for (let i = 0; i < count; i++) {
        const availableCivIdx = state.units.findIndex(u => u.type === 'civilian' && u.assignedMineId == null);

        if (availableCivIdx === -1) {
          if (trainedCount === 0) {
            showDialog("Recruitment Error", "Requires an available civilian to convert!");
          }
          break;
        }
        if (state.resources < costPerUnit) {
          if (trainedCount === 0) {
            showDialog("Resource Deficit", `Insufficient resources to train ${unitType.toUpperCase()}. Required: ${costPerUnit}g per unit.`);
          }
          break;
        }

        state.resources -= costPerUnit;
        state.units.splice(availableCivIdx, 1);

        const spawnX = building.tileX;
        const spawnY = building.tileY;
        const newUnit = createUnit(unitType, spawnX, spawnY, 'blue');

        if (targetTile) {
          newUnit.targetX = targetTile.x;
          newUnit.targetY = targetTile.y;

          const targetBld = state.buildings.find(b => b.tileX === targetTile.x && b.tileY === targetTile.y);
          if (targetBld) newUnit.targetBuildingId = targetBld.id;
        }

        state.units.push(newUnit);
        trainedCount++;
      }
      updateUI();
    }

    function getStructureCapacity(building) {
      return building.capacity || building.capBonus || 10;
    }

    function getTileOccupancy(tileX, tileY) {
      const targetBuilding = state.buildings.find(b => b.tileX === tileX && b.tileY === tileY);
      if (targetBuilding) {
        return state.units.filter(u => u.garrisonedBuildingId === targetBuilding.id).length;
      }
      return state.units.filter(u => !u.garrisonedBuildingId && Math.floor(u.x) === tileX && Math.floor(u.y) === tileY).length;
    }

    function getTileCapacity(tileX, tileY) {
      const targetBuilding = state.buildings.find(b => b.tileX === tileX && b.tileY === tileY);
      if (targetBuilding) {
        return getStructureCapacity(targetBuilding);
      }
      return 10;
    }

      if (!state.targetTile) {

      document.getElementById('modal-title').innerText = `${building.type.toUpperCase()} #${building.id} -> Target (${state.targetTile.x}, ${state.targetTile.y})`;
      
      if (sourceAvailable === 0) {

            <button type="button" style="padding: 4px 8px; font-size: 11px;" onclick="document.getElementById('deploy-range').value=Math.min(5, ${maxCount}); document.getElementById('range-val').innerText=Math.min(5, ${maxCount});">5</button>
            <button type="button" style="padding: 4px 8px; font-size: 11px;" onclick="document.getElementById('deploy-range').value=${maxCount}; document.getElementById('range-val').innerText=${maxCount};">Max (${maxCount})</button>
          </div>
        </div>
      `;

      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';

      const sendBtn = document.createElement('button');
      sendBtn.innerText = 'Confirm Send';
      sendBtn.onclick = () => {
        const count = parseInt(document.getElementById('deploy-range').value, 10);
        deployUnitsFromStructure(building, count, state.targetTile);
        dialog.close();
      };

      const closeBtn = document.createElement('button');
      closeBtn.innerText = 'Cancel';
      closeBtn.onclick = () => dialog.close();

      actionsEl.appendChild(sendBtn);
      actionsEl.appendChild(closeBtn);

      dialog.showModal();
    }

    function deployUnitsFromStructure(building, count, targetTile) {
      const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === building.id);
      const targetBld = state.buildings.find(b => b.tileX === targetTile.x && b.tileY === targetTile.y);
      const targetCapacity = targetBld ? getStructureCapacity(targetBld) : 10;
      const targetOccupancy = targetBld
        ? state.units.filter(u => u.garrisonedBuildingId === targetBld.id).length
        : state.units.filter(u => !u.garrisonedBuildingId && Math.floor(u.x) === targetTile.x && Math.floor(u.y) === targetTile.y).length;
      const dispatchCount = Math.min(count, garrisonedUnits.length, Math.max(0, targetCapacity - targetOccupancy));

      for (let i = 0; i < dispatchCount; i++) {
        const unit = garrisonedUnits[i];
        unit.garrisonedBuildingId = null;
        unit.assignedMineId = null;
        unit.x = building.tileX;
        unit.y = building.tileY;
        unit.targetX = targetTile.x;
        unit.targetY = targetTile.y;

        if (targetBld) {
          unit.targetBuildingId = targetBld.id;
          if (targetBld.type === 'mine' && unit.type === 'civilian') {
            unit.targetMineId = targetBld.id;
          }
        } else {
          unit.targetBuildingId = null;
          unit.targetMineId = null;
        }
      }
      updateUI();
    }

    function getSelectedEntity() {

             state.buildings.find(b => b.id === state.selectedEntityId);
