<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid RTS Engine - Kiomet & Travian Inspired</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --void: #0b0d0a;
      --panel: rgba(18, 21, 16, 0.93);
      --panel-raised: rgba(24, 28, 21, 0.96);
      --line: rgba(217, 164, 65, 0.20);
      --line-strong: rgba(217, 164, 65, 0.45);
      --amber: #d9a441;
      --amber-bright: #f2c368;
      --text: #e8e4d8;
      --text-dim: #9a9f8e;
      --text-faint: #5f6459;
      --ok: #7a9d5c;
      --danger: #c1443a;
      --font-display: 'Barlow Condensed', 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--void);
      font-family: var(--font-display);
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Faint scanline atmosphere over the whole viewport */
    #canvas-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.10) 0px,
        rgba(0, 0, 0, 0.10) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.35;
      z-index: 2;
    }

    /* Command HUD overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .hud-panel {
      position: relative;
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      border-radius: 2px;
      padding: 13px 20px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    /* Corner-bracket motif — reads as targeting/console framing */
    .hud-panel::before,
    .hud-panel::after,
    dialog::before,
    dialog::after {
      content: '';
      position: absolute;
      width: 11px;
      height: 11px;
      border: 2px solid var(--amber);
      pointer-events: none;
      opacity: 0.85;
    }
    .hud-panel::before, dialog::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .hud-panel::after, dialog::after   { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* Top HUD: Resource & Population Bar */
    #top-bar {
      align-self: center;
      display: flex;
      align-items: center;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-dim);
    }

    .res-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      border-left: 1px solid var(--line);
    }

    .res-item:first-child {
      border-left: none;
      padding-left: 0;
    }

    .res-item:last-child {
      padding-right: 0;
    }

    .res-item img {
      width: 17px;
      height: 17px;
      object-fit: contain;
      filter: drop-shadow(0 0 3px rgba(217, 164, 65, 0.35));
    }

    .res-value {
      color: var(--amber-bright);
      font-size: 15px;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0;
    }

    /* Bottom Inspector & Build Bar */
    #bottom-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    #inspector-panel {
      min-width: 360px;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
      margin-bottom: 2px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: var(--panel-raised);
      border: 1px solid var(--line-strong);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 0;
      clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    button:hover:not(:disabled) {
      background: rgba(217, 164, 65, 0.16);
      border-color: var(--amber);
      color: var(--amber-bright);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .active-mode {
      background: rgba(217, 164, 65, 0.28);
      border-color: var(--amber);
      color: var(--amber-bright);
    }

    dialog {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 20px;
      border-radius: 0;
      width: 90vw;
      max-width: 600px;
      margin: auto;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.75);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }

    .dialog-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--amber-bright);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .dialog-section {
      margin: 12px 0;
      font-size: 13px;
    }

    .close-dialog {
      float: right;
      font-size: 20px;
      font-weight: bold;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      line-height: 20px;
      text-align: center;
    }

    .close-dialog:hover {
      color: var(--amber-bright);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div id="top-bar" class="hud-panel">
      <div class="res-item">
        <span>RESOURCES:</span>
        <span class="res-value" id="ui-resources">0</span>
      </div>
      <div class="res-item">
        <span>CIVILIANS:</span>
        <span class="res-value" id="ui-civilians">0 / 0</span>
      </div>
      <div class="res-item">
        <span>MINERS:</span>
        <span class="res-value" id="ui-miners">0</span>
      </div>
      <div class="res-item">
        <span>SOLDIERS:</span>
        <span class="res-value" id="ui-soldiers">0</span>
      </div>
      <div class="res-item">
        <span>TANKS:</span>
        <span class="res-value" id="ui-tanks">0</span>
      </div>
    </div>

    <div id="bottom-hud">
      <div id="inspector-panel" class="hud-panel">
        <div class="panel-title">Inspector</div>
        <div id="inspector-title" style="color: #d9a441; font-weight: 600; margin-bottom: 2px;"></div>
        <div id="inspector-details" style="font-size: 11px; color: #9a9f8e; line-height: 1.4;"></div>
        <div id="inspector-actions" class="btn-group"></div>
        <button id="btn-deselect" style="margin-top: 6px; display: none; align-self: flex-start;">Deselect</button>
      </div>

      <div class="hud-panel">
        <div class="panel-title">Build / Spawn</div>
        <div class="btn-group">
          <button onclick="startBuild('residence')">Residence (40)</button>
          <button onclick="startBuild('barracks')">Barracks (60)</button>
          <button onclick="startBuild('armory')">Armory (120)</button>
          <button onclick="startBuild('radar')">Radar (75)</button>
        </div>
        <div class="btn-group" style="margin-top: 8px;">
          <button onclick="spawnCivilians()">Spawn Civilians</button>
          <button onclick="spawnSoldiers()">Spawn Soldiers</button>
          <button onclick="spawnTanks()">Spawn Tanks</button>
        </div>
      </div>
    </div>
  </div>

  <dialog id="barracks-dialog">
    <span class="close-dialog" onclick="document.getElementById('barracks-dialog').close();">×</span>
    <div class="dialog-title">Barracks Options</div>
    <div class="dialog-section">
      <button onclick="trainSoldier()">Train Soldier (15 res)</button>
      <div style="font-size: 11px; color: #9a9f8e; margin-top: 6px;">Soldiers are effective against infantry units and light armor.</div>
    </div>
  </dialog>

  <dialog id="armory-dialog">
    <span class="close-dialog" onclick="document.getElementById('armory-dialog').close();">×</span>
    <div class="dialog-title">Armory Options</div>
    <div class="dialog-section">
      <button onclick="trainTank()">Train Tank (40 res)</button>
      <div style="font-size: 11px; color: #9a9f8e; margin-top: 6px;">Tanks are heavily armored and deal splash damage with their cannons.</div>
    </div>
  </dialog>

  <dialog id="garrison-dialog">
    <span class="close-dialog" onclick="document.getElementById('garrison-dialog').close();">×</span>
    <div class="dialog-title">Deploy Garrisoned Units</div>
    <div class="dialog-section" id="garrison-options"></div>
  </dialog>

  <script>
    const TILE_SIZE = 48;
    const GRID_WIDTH = 64;
    const GRID_HEIGHT = 64;

    // ==========================================
    // BUILDING INFO DATABASE
    // ==========================================
    const BUILDING_INFO = {
      residence: {
        title: 'Residence',
        desc: 'Provides housing for up to 10 civilians. Auto-spawns civilians when at capacity.',
        stats: 'Cost: 40 | Capacity: 10 | HP: 150'
      },
      barracks: {
        title: 'Barracks',
        desc: 'Trains soldiers and can garrison up to 40 military units.',
        stats: 'Cost: 60 | Capacity: 40 | HP: 150'
      },
      armory: {
        title: 'Armory',
        desc: 'Trains tanks and can garrison up to 25 heavy units.',
        stats: 'Cost: 120 | Capacity: 25 | HP: 150'
      },
      radar: {
        title: 'Radar Station',
        desc: 'Defensive structure that detects threats. Can garrison up to 15 units.',
        stats: 'Cost: 75 | Capacity: 15 | HP: 150'
      },
      mine: {
        title: 'Mine',
        desc: 'Resource extraction point. Automatically produces resources when garrisoned with civilians.',
        stats: 'Cost: 25 | Capacity: 10 | HP: 150'
      }
    };

    // ==========================================
    // ASSET PATHS
    // ==========================================
    const ASSETS = {
      civilian: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIGZpbGw9InJnYigxMCwgMTMsIDEwKSIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iOCIgcj0iNSIgZmlsbD0iI2Q5YTQ0MSIvPjxyZWN0IHg9IjExIiB5PSIxNSIgd2lkdGg9IjEwIiBoZWlnaHQ9IjgiIGZpbGw9IiNkOWE0NDEiLz48cmVjdCB4PSI4IiB5PSIyMyIgd2lkdGg9IjEwIiBoZWlnaHQ9IjYiIGZpbGw9IiNkOWE0NDEiLz48cmVjdCB4PSIxNCIgeT0iMjMiIHdpZHRoPSI0IiBoZWlnaHQ9IjYiIGZpbGw9IiNkOWE0NDEiLz48L3N2Zz4=',
      soldier: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIGZpbGw9InJnYigxMCwgMTMsIDEwKSIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iOCIgcj0iNSIgZmlsbD0iIzdhOWQ1YyIvPjxyZWN0IHg9IjEwIiB5PSIxNSIgd2lkdGg9IjEyIiBoZWlnaHQ9IjgiIGZpbGw9IiM3YTlkNWMiLz48cmVjdCB4PSI2IiB5PSIxNiIgd2lkdGg9IjQiIGhlaWdodD0iMSIgZmlsbD0iIzdhOWQ1YyIvPjxyZWN0IHg9IjIyIiB5PSIxNiIgd2lkdGg9IjQiIGhlaWdodD0iMSIgZmlsbD0iIzdhOWQ1YyIvPjxyZWN0IHg9IjEwIiB5PSIyMyIgd2lkdGg9IjEwIiBoZWlnaHQ9IjYiIGZpbGw9IiM3YTlkNWMiLz48L3N2Zz4=',
      tank: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIGZpbGw9InJnYigxMCwgMTMsIDEwKSIvPjxyZWN0IHg9IjYiIHk9IjEwIiB3aWR0aD0iMjAiIGhlaWdodD0iMTIiIGZpbGw9IiNmYjkyM2MiLz48cmVjdCB4PSIxMCIgeT0iNiIgd2lkdGg9IjEyIiBoZWlnaHQ9IjYiIGZpbGw9IiNmYjkyM2MiLz48cmVjdCB4PSI2IiB5PSIyMiIgd2lkdGg9IjQiIGhlaWdodD0iNiIgZmlsbD0iI2ZiOTIzYyIvPjxyZWN0IHg9IjIyIiB5PSIyMiIgd2lkdGg9IjQiIGhlaWdodD0iNiIgZmlsbD0iI2ZiOTIzYyIvPjxyZWN0IHg9IjE0IiB5PSI0IiB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjJjMzY4Ii8+PC9zdmc+'
    };

    // ==========================================
    // 1. GAME STATE
    // ==========================================
    const state = {
      resources: 800,
      camera: { x: 0, y: 0 },
      hoveredTile: { x: 0, y: 0 },
      selectedEntityId: null,
      selectedEntityType: null,
      targetTile: null,
      buildMode: null,
      units: [],
      buildings: [],
      civilianCap: 10,
      nextUnitId: 1,
      nextBuildingId: 1
    };

    // ==========================================
    // 2. RESIDENCE CAPACITY TRACKING SYSTEM
    // ==========================================
    class ResidenceOccupant {
      constructor(civilianId, x, y, state) {
        this.civilianId = civilianId;
        this.x = x;  // position within residence (0-9, grid coords)
        this.y = y;
        this.state = state;  // 'idle', 'working', 'moving'
      }
    }

    class Residence {
      constructor(buildingId, tileX, tileY, capacity = 10) {
        this.buildingId = buildingId;
        this.tileX = tileX;
        this.tileY = tileY;
        this.capacity = capacity;
        this.occupants = [];  // Array of ResidenceOccupant objects
      }

      addCivilian(civilianId, civilianX, civilianY) {
        if (this.occupants.length >= this.capacity) {
          return false;  // Residence at capacity
        }
        const occupant = new ResidenceOccupant(civilianId, civilianX, civilianY, 'idle');
        this.occupants.push(occupant);
        return true;
      }

      removeCivilian(civilianId) {
        const idx = this.occupants.findIndex(o => o.civilianId === civilianId);
        if (idx >= 0) {
          this.occupants.splice(idx, 1);
          return true;
        }
        return false;
      }

      isFull() {
        return this.occupants.length >= this.capacity;
      }

      getOccupancyString() {
        return `${this.occupants.length}/${this.capacity}`;
      }
    }

    // ==========================================
    // 3. BUILDING SYSTEM WITH RESIDENCES
    // ==========================================
    const residences = new Map();  // buildingId -> Residence

    function createBuilding(type, tileX, tileY) {
      const costs = {
        residence: 40,
        barracks: 60,
        armory: 120,
        radar: 75,
        mine: 25
      };

      const cost = costs[type] || 0;
      if (state.resources < cost) return null;

      const building = {
        id: state.nextBuildingId++,
        type: type,
        tileX: tileX,
        tileY: tileY,
        hp: 150,
        maxHp: 150,
        capacity: type === 'barracks' ? 40 : type === 'armory' ? 25 : 15,
        capBonus: type === 'residence' ? 10 : 0
      };

      // Initialize residence tracking
      if (type === 'residence') {
        residences.set(building.id, new Residence(building.id, tileX, tileY, 10));
      }

      state.buildings.push(building);
      state.resources -= cost;
      return building;
    }

    function garrisonCivilianInResidence(civil, residenceId) {
      const residence = residences.get(residenceId);
      if (!residence) return false;

      if (residence.isFull()) {
        console.warn(`Residence #${residenceId} is at full capacity`);
        return false;
      }

      // Remove from previous garrison if any
      if (civil.garrisonedBuildingId) {
        const oldRes = residences.get(civil.garrisonedBuildingId);
        if (oldRes) {
          oldRes.removeCivilian(civil.id);
        }
      }

      // Add to new residence
      if (residence.addCivilian(civil.id, Math.floor(civil.x), Math.floor(civil.y))) {
        civil.garrisonedBuildingId = residenceId;
        civil.x = residenceId;  // Use building ID as proxy position while garrisoned
        civil.y = Math.floor(Math.random() * 10);  // Random slot within residence
        return true;
      }

      return false;
    }

    function deployFromResidence(residenceId, count = null) {
      const residence = residences.get(residenceId);
      if (!residence || residence.occupants.length === 0) return [];

      const deployed = [];
      const deployCount = count || residence.occupants.length;

      for (let i = 0; i < deployCount && residence.occupants.length > 0; i++) {
        const occupant = residence.occupants.pop();
        const unit = state.units.find(u => u.id === occupant.civilianId);

        if (unit) {
          unit.garrisonedBuildingId = null;
          unit.x = Math.random() * TILE_SIZE;
          unit.y = Math.random() * TILE_SIZE;
          deployed.push(unit);
        }
      }

      return deployed;
    }

    // ==========================================
    // 4. UNIT SYSTEM
    // ==========================================
    function createUnit(type, x, y) {
      const costs = { civilian: 5, soldier: 15, tank: 40 };
      const cost = costs[type] || 0;

      if (state.resources < cost) return null;

      const unitStats = {
        civilian: { maxHp: 15, speed: 2.5 },
        soldier: { maxHp: 30, speed: 3.0 },
        tank: { maxHp: 80, speed: 2.0 }
      };

      const stats = unitStats[type] || { maxHp: 10, speed: 1.0 };

      const unit = {
        id: state.nextUnitId++,
        type: type,
        x: x,
        y: y,
        hp: stats.maxHp,
        maxHp: stats.maxHp,
        speed: stats.speed,
        targetX: x,
        targetY: y,
        garrisonedBuildingId: null,
        assignedMineId: null,
        fireControl: 'aggressive',
        entityType: 'unit'
      };

      state.units.push(unit);
      state.resources -= cost;
      return unit;
    }

    function spawnCivilians() {
      const count = Math.min(20, Math.floor(state.resources / 5));
      if (count === 0) return;

      for (let i = 0; i < count; i++) {
        const x = Math.random() * GRID_WIDTH;
        const y = Math.random() * GRID_HEIGHT;
        createUnit('civilian', x, y);
      }

      updateUI();
    }

    function spawnSoldiers() {
      const count = Math.min(10, Math.floor(state.resources / 15));
      if (count === 0) return;
      for (let i = 0; i < count; i++) {
        const x = Math.random() * GRID_WIDTH;
        const y = Math.random() * GRID_HEIGHT;
        createUnit('soldier', x, y);
      }
      updateUI();
    }

    function spawnTanks() {
      const count = Math.min(5, Math.floor(state.resources / 40));
      if (count === 0) return;
      for (let i = 0; i < count; i++) {
        const x = Math.random() * GRID_WIDTH;
        const y = Math.random() * GRID_HEIGHT;
        createUnit('tank', x, y);
      }
      updateUI();
    }

    // ==========================================
    // 5. BUILD MODE & PLACEMENT
    // ==========================================
    function startBuild(type) {
      state.buildMode = type;
    }

    function placeBuilding(tileX, tileY) {
      if (!state.buildMode) return;

      const building = createBuilding(state.buildMode, tileX, tileY);
      if (!building) {
        console.warn('Failed to place building');
      }

      state.buildMode = null;
      updateUI();
    }

    // ==========================================
    // 6. INTERACTION & SELECTION
    // ==========================================
    function getSelectedEntity() {
      if (!state.selectedEntityId) return null;

      if (state.selectedEntityType === 'unit') {
        return state.units.find(u => u.id === state.selectedEntityId) || null;
      } else if (state.selectedEntityType === 'building') {
        return state.buildings.find(b => b.id === state.selectedEntityId) || null;
      }

      return null;
    }

    function selectEntity(id, type) {
      state.selectedEntityId = id;
      state.selectedEntityType = type;
      updateUI();
    }

    function deselect() {
      state.selectedEntityId = null;
      state.selectedEntityType = null;
      updateUI();
    }

    function openBarracksDialog(building) {
      document.getElementById('barracks-dialog').showModal();
      window.currentBuilding = building;
    }

    function openArmoryDialog(building) {
      document.getElementById('armory-dialog').showModal();
      window.currentBuilding = building;
    }

    function openStructureGarrisonDialog(building) {
      const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === building.id);
      const dialog = document.getElementById('garrison-dialog');
      const options = document.getElementById('garrison-options');

      options.innerHTML = `<p>Deploy ${garrisonedUnits.length} unit(s)?</p>`;
      const btn = document.createElement('button');
      btn.textContent = 'Deploy All';
      btn.onclick = () => {
        deployFromResidence(building.id);
        dialog.close();
        updateUI();
      };
      options.appendChild(btn);

      dialog.showModal();
    }

    function trainSoldier() {
      const building = window.currentBuilding;
      if (!building || state.resources < 15) return;

      const soldier = createUnit('soldier', building.tileX, building.tileY);
      if (soldier) {
        soldier.garrisonedBuildingId = building.id;
      }

      updateUI();
    }

    function trainTank() {
      const building = window.currentBuilding;
      if (!building || state.resources < 40) return;

      const tank = createUnit('tank', building.tileX, building.tileY);
      if (tank) {
        tank.garrisonedBuildingId = building.id;
      }

      updateUI();
    }

    // ==========================================
    // 7. CANVAS & RENDERING
    // ==========================================
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.getElementById('canvas-container').appendChild(canvas);

    const ctx = canvas.getContext('2d');

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // ==========================================
    // 8. INPUT HANDLING
    // ==========================================
    let keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === 'Escape') deselect();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left - state.camera.x;
      const my = e.clientY - rect.top - state.camera.y;

      state.hoveredTile.x = Math.floor(mx / TILE_SIZE);
      state.hoveredTile.y = Math.floor(my / TILE_SIZE);
    });

    canvas.addEventListener('click', (e) => {
      const hx = state.hoveredTile.x;
      const hy = state.hoveredTile.y;

      // Check buildings first
      const building = state.buildings.find(b => b.tileX === hx && b.tileY === hy);
      if (building) {
        selectEntity(building.id, 'building');
        return;
      }

      // Check units
      const unit = state.units.find(u => !u.garrisonedBuildingId && Math.floor(u.x) === hx && Math.floor(u.y) === hy);
      if (unit) {
        selectEntity(unit.id, 'unit');
        return;
      }

      deselect();
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (state.buildMode) {
        placeBuilding(state.hoveredTile.x, state.hoveredTile.y);
      } else {
        state.targetTile = { x: state.hoveredTile.x, y: state.hoveredTile.y };
      }
    });

    // ==========================================
    // 9. GAME LOGIC
    // ==========================================
    function updateCombatAndMovement(deltaTime) {
      state.units.forEach(unit => {
        if (unit.garrisonedBuildingId) return;  // Skip garrisoned units

        const dist = Math.hypot(unit.targetX - unit.x, unit.targetY - unit.y);
        if (dist > 0.1) {
          const vx = (unit.targetX - unit.x) / dist;
          const vy = (unit.targetY - unit.y) / dist;
          unit.x += vx * unit.speed * (deltaTime / 16);
          unit.y += vy * unit.speed * (deltaTime / 16);
        }
      });

      // Auto-assign idle civilians to nearest residence
      state.units.filter(u => u.type === 'civilian' && !u.garrisonedBuildingId).forEach(civ => {
        const nearest = Array.from(residences.values()).find(r => !r.isFull());
        if (nearest) {
          garrisonCivilianInResidence(civ, nearest.buildingId);
        }
      });

      // Auto-generate resources from garrisoned civilians in residences
      residences.forEach((residence) => {
        state.resources += residence.occupants.length * 1.2;
      });

      // AUTO-SPAWN CIVILIANS when residence has capacity
      residences.forEach((residence) => {
        if (!residence.isFull() && state.resources >= 5) {
          // Auto-spawn one civilian per frame if space available
          const civil = createUnit('civilian', residence.tileX + 0.5, residence.tileY + 0.5);
          if (civil) {
            garrisonCivilianInResidence(civil, residence.buildingId);
          }
        }
      });
    }

    function applyKeyboardPan(deltaTime) {
      const panSpeed = 400;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) state.camera.y += panSpeed * (deltaTime / 1000);
      if (keys['ArrowDown'] || keys['s'] || keys['S']) state.camera.y -= panSpeed * (deltaTime / 1000);
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) state.camera.x += panSpeed * (deltaTime / 1000);
      if (keys['ArrowRight'] || keys['d'] || keys['D']) state.camera.x -= panSpeed * (deltaTime / 1000);
    }

    // ==========================================
    // 10. UI UPDATER
    // ==========================================
    function updateUI() {
      document.getElementById('ui-resources').innerText = Math.floor(state.resources);

      const totalCivs = state.units.filter(u => u.type === 'civilian').length;
      const maxCivCapacity = residences.size * 10;
      document.getElementById('ui-civilians').innerText = `${totalCivs} / ${maxCivCapacity}`;

      const totalMiners = state.units.filter(u => {
        if (u.type !== 'civilian') return false;
        if (u.assignedMineId) return true;
        if (u.garrisonedBuildingId) {
          const building = state.buildings.find(b => b.id === u.garrisonedBuildingId);
          return building && building.type === 'mine';
        }
        return false;
      }).length;
      document.getElementById('ui-miners').innerText = totalMiners;

      const soldierCount = state.units.filter(u => u.type === 'soldier').length;
      const tankCount = state.units.filter(u => u.type === 'tank').length;
      document.getElementById('ui-tanks').innerText = tankCount;
      document.getElementById('ui-soldiers').innerText = soldierCount;

      const entity = getSelectedEntity();
      const titleEl = document.getElementById('inspector-title');
      const detailsEl = document.getElementById('inspector-details');
      const actionsEl = document.getElementById('inspector-actions');
      const deselectBtn = document.getElementById('btn-deselect');
      actionsEl.innerHTML = '';

      if (!entity) {
        const hoveredBld = state.buildings.find(b => b.tileX === state.hoveredTile.x && b.tileY === state.hoveredTile.y);
        if (hoveredBld) {
          const info = BUILDING_INFO[hoveredBld.type] || { title: hoveredBld.type, desc: '', stats: '' };
          let occupancyStr = '';

          if (hoveredBld.type === 'residence') {
            const res = residences.get(hoveredBld.id);
            occupancyStr = res ? res.getOccupancyString() : '0/10';
          } else {
            const garrisoned = state.units.filter(u => u.garrisonedBuildingId === hoveredBld.id);
            occupancyStr = `${garrisoned.length}/${hoveredBld.capacity}`;
          }

          titleEl.innerText = `${info.title} #${hoveredBld.id}`;
          detailsEl.innerHTML = `
            <strong>${info.title}</strong><br/>
            ${info.stats}<br/>
            Occupancy: <span style="color:#d9a441;">${occupancyStr}</span><br/>
            Tile: (${hoveredBld.tileX}, ${hoveredBld.tileY})
          `;
          deselectBtn.style.display = 'none';
          return;
        }

        titleEl.innerText = 'Selection: None';
        detailsEl.innerText = 'Left-click to select a unit or structure. Right-click a tile to build/move.';
        deselectBtn.style.display = 'none';
        return;
      }

      deselectBtn.style.display = 'block';

      if (entity.entityType === 'unit') {
        const uTileX = Math.floor(entity.x);
        const uTileY = Math.floor(entity.y);
        titleEl.innerText = `${entity.type.toUpperCase()} ID: ${entity.id}`;

        let status = 'Idle';
        if (entity.garrisonedBuildingId) {
          status = `Garrisoned in Building #${entity.garrisonedBuildingId}`;
        } else if (entity.assignedMineId) {
          status = `Mining #${entity.assignedMineId}`;
        }

        detailsEl.innerText = `HP: ${Math.ceil(entity.hp)}/${entity.maxHp} | Tile: (${uTileX}, ${uTileY}) | Status: ${status}`;
      } else if (entity.entityType === 'building') {
        const info = BUILDING_INFO[entity.type] || { title: entity.type, desc: '', stats: '' };

        titleEl.innerText = `${info.title.toUpperCase()} ID: ${entity.id}`;

        let occupancyStr = '';
        let garrisonedUnits = [];

        if (entity.type === 'residence') {
          const res = residences.get(entity.id);
          if (res) {
            occupancyStr = res.getOccupancyString();
            garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === entity.id);
          }
        } else {
          garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === entity.id);
          occupancyStr = `${garrisonedUnits.length}/${entity.capacity}`;
        }

        detailsEl.innerHTML = `
          <strong>${info.title}</strong><br/>
          HP: ${entity.hp}/${entity.maxHp} | Tile: (${entity.tileX}, ${entity.tileY})<br/>
          Occupancy: <span style="color:#d9a441;">${occupancyStr}</span>
        `;

        if (garrisonedUnits.length > 0) {
          const deployBtn = document.createElement('button');
          deployBtn.textContent = `Deploy ${garrisonedUnits.length} Unit(s)`;
          deployBtn.onclick = () => {
            deployFromResidence(entity.id);
            deselect();
          };
          actionsEl.appendChild(deployBtn);
        }

        if (entity.type === 'barracks') {
          const trainBtn = document.createElement('button');
          trainBtn.textContent = 'Train Soldier (15)';
          trainBtn.onclick = () => openBarracksDialog(entity);
          actionsEl.appendChild(trainBtn);
        } else if (entity.type === 'armory') {
          const trainBtn = document.createElement('button');
          trainBtn.textContent = 'Train Tank (40)';
          trainBtn.onclick = () => openArmoryDialog(entity);
          actionsEl.appendChild(trainBtn);
        }
      }
    }

    // ==========================================
    // 11. RENDERING
    // ==========================================
    function render() {
      ctx.fillStyle = 'rgb(11, 13, 10)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(state.camera.x, state.camera.y);

      // Render grid
      ctx.strokeStyle = 'rgba(217, 164, 65, 0.1)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= GRID_WIDTH; x++) {
        ctx.beginPath();
        ctx.moveTo(x * TILE_SIZE, 0);
        ctx.lineTo(x * TILE_SIZE, GRID_HEIGHT * TILE_SIZE);
        ctx.stroke();
      }
      for (let y = 0; y <= GRID_HEIGHT; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * TILE_SIZE);
        ctx.lineTo(GRID_WIDTH * TILE_SIZE, y * TILE_SIZE);
        ctx.stroke();
      }

      // Render buildings
      state.buildings.forEach(b => {
        const px = b.tileX * TILE_SIZE;
        const py = b.tileY * TILE_SIZE;

        const colorMap = {
          residence: 'rgba(122, 157, 92, 0.6)',
          barracks: 'rgba(251, 146, 60, 0.6)',
          armory: 'rgba(193, 68, 58, 0.6)',
          radar: 'rgba(100, 150, 200, 0.6)',
          mine: 'rgba(180, 140, 60, 0.6)'
        };

        ctx.fillStyle = colorMap[b.type] || 'rgba(217, 164, 65, 0.5)';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

        const selected = state.selectedEntityId === b.id && state.selectedEntityType === 'building';
        ctx.strokeStyle = selected ? '#d9a441' : 'rgba(217, 164, 65, 0.4)';
        ctx.lineWidth = selected ? 3 : 1;
        ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

        // Render capacity indicator for residences
        if (b.type === 'residence') {
          const res = residences.get(b.id);
          if (res) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(res.getOccupancyString(), px + 8, py + TILE_SIZE - 6);
          }
        }
      });

      // Render units
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;

        const px = u.x * TILE_SIZE;
        const py = u.y * TILE_SIZE;

        const colorMap = {
          civilian: 'rgba(217, 164, 65, 0.8)',
          soldier: 'rgba(122, 157, 92, 0.8)',
          tank: 'rgba(251, 146, 60, 0.8)'
        };

        ctx.fillStyle = colorMap[u.type] || 'rgba(217, 164, 65, 0.5)';
        ctx.fillRect(px + 8, py + 8, TILE_SIZE - 16, TILE_SIZE - 16);

        const selected = state.selectedEntityId === u.id && state.selectedEntityType === 'unit';
        ctx.strokeStyle = selected ? '#f2c368' : 'rgba(217, 164, 65, 0.3)';
        ctx.lineWidth = selected ? 3 : 1;
        ctx.strokeRect(px + 8, py + 8, TILE_SIZE - 16, TILE_SIZE - 16);

        // HP bar
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(px + 8, py - 6, TILE_SIZE - 16, 4);
        ctx.fillStyle = '#7a9d5c';
        ctx.fillRect(px + 8, py - 6, (TILE_SIZE - 16) * (u.hp / u.maxHp), 4);
      });

      // Tile hover highlight
      const hx = state.hoveredTile.x * TILE_SIZE;
      const hy = state.hoveredTile.y * TILE_SIZE;

      if (state.buildMode) {
        const costs = { residence: 100, barracks: 200, armory: 500, radar: 250 };
        const cost = costs[state.buildMode] || 0;
        const occupied = state.buildings.some(b => b.tileX === state.hoveredTile.x && b.tileY === state.hoveredTile.y);
        const affordable = state.resources >= cost;
        const valid = !occupied && affordable;

        const color = valid ? '122, 157, 92' : '193, 68, 58';
        ctx.fillStyle = `rgba(${color}, 0.18)`;
        ctx.fillRect(hx, hy, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = `rgb(${color})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(hx, hy, TILE_SIZE, TILE_SIZE);
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(hx, hy, TILE_SIZE, TILE_SIZE);
      }

      ctx.restore();
    }

    // ==========================================
    // 12. GAME LOOP
    // ==========================================
    let lastTime = performance.now();
    function gameLoop(now) {
      const deltaTime = now - lastTime;
      lastTime = now;

      applyKeyboardPan(deltaTime);
      updateCombatAndMovement(deltaTime);
      render();
      updateUI();

      requestAnimationFrame(gameLoop);
    }

    // Initialize game with balanced starting buildings
    createBuilding('residence', 5, 5);
    createBuilding('residence', 8, 5);
    createBuilding('barracks', 10, 10);

    updateUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
