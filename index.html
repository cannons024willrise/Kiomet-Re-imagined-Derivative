<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid RTS Engine - Kiomet & Travian Inspired</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --void: #0b0d0a;
      --panel: rgba(18, 21, 16, 0.93);
      --panel-raised: rgba(24, 28, 21, 0.96);
      --line: rgba(217, 164, 65, 0.20);
      --line-strong: rgba(217, 164, 65, 0.45);
      --amber: #d9a441;
      --amber-bright: #f2c368;
      --text: #e8e4d8;
      --text-dim: #9a9f8e;
      --text-faint: #5f6459;
      --ok: #7a9d5c;
      --danger: #c1443a;
      --font-display: 'Barlow Condensed', 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--void);
      font-family: var(--font-display);
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Faint scanline atmosphere over the whole viewport */
    #canvas-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.10) 0px,
        rgba(0, 0, 0, 0.10) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.35;
      z-index: 2;
    }

    /* Command HUD overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .hud-panel {
      position: relative;
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      border-radius: 2px;
      padding: 13px 20px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    /* Corner-bracket motif — reads as targeting/console framing */
    .hud-panel::before,
    .hud-panel::after,
    dialog::before,
    dialog::after {
      content: '';
      position: absolute;
      width: 11px;
      height: 11px;
      border: 2px solid var(--amber);
      pointer-events: none;
      opacity: 0.85;
    }
    .hud-panel::before, dialog::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .hud-panel::after, dialog::after   { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* Top HUD: Resource & Population Bar */
    #top-bar {
      align-self: center;
      display: flex;
      align-items: center;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-dim);
    }

    .res-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      border-left: 1px solid var(--line);
    }

    .res-item:first-child {
      border-left: none;
      padding-left: 0;
    }

    .res-item:last-child {
      padding-right: 0;
    }

    .res-item img {
      width: 17px;
      height: 17px;
      object-fit: contain;
      filter: drop-shadow(0 0 3px rgba(217, 164, 65, 0.35));
    }

    .res-value {
      color: var(--amber-bright);
      font-size: 15px;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0;
    }

    /* Bottom Inspector & Build Bar */
    #bottom-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    #inspector-panel {
      min-width: 360px;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
      margin-bottom: 2px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: var(--panel-raised);
      border: 1px solid var(--line-strong);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 0;
      clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    button:hover:not(:disabled) {
      background: rgba(217, 164, 65, 0.16);
      border-color: var(--amber);
      color: var(--amber-bright);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.08);
    }

    .active-mode {
      background: rgba(217, 164, 65, 0.22) !important;
      border-color: var(--amber) !important;
      color: var(--amber-bright) !important;
    }

    /* Fire Control Selection Styling */
    .fc-btn {
      font-size: 10.5px;
      padding: 5px 9px;
    }

    #build-menu {
      display: flex;
      gap: 8px;
    }

    .shortcut-tag {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0;
      text-transform: none;
      margin-left: 4px;
    }

    /* Modal Dialog Styling */
    dialog {
      position: relative;
      pointer-events: auto;
      background: var(--panel-raised);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--font-display);
      padding: 22px 26px;
      min-width: 340px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    dialog::before, dialog::after { width: 14px; height: 14px; }

    dialog::backdrop {
      background: rgba(4, 5, 3, 0.72);
      backdrop-filter: blur(4px);
    }

    .dialog-title {
      font-size: 16px;
      color: var(--amber-bright);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .dialog-body {
      font-size: 13.5px;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text-dim);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-layer">
    <!-- Top Bar -->
    <div id="top-bar" class="hud-panel">
      <div class="res-item">
        <img id="icon-res" alt="Resources" />
        <span>Resources:</span>
        <span id="ui-resources" class="res-value">0</span>
      </div>
      <div class="res-item">
        <img id="icon-civ" alt="Civilians" />
        <span>Civilians:</span>
        <span id="ui-civilians" class="res-value">15 / 20</span>
        <span style="font-size: 11px; color: #5f6459;">(<span id="ui-miners">0</span> Mining)</span>
      </div>
      <div class="res-item">
        <img id="icon-tank" alt="Tanks" />
        <span>Tanks:</span>
        <span id="ui-tanks" class="res-value">0</span>
      </div>
      <div class="res-item">
        <img id="icon-soldier" alt="Soldiers" />
        <span>Soldiers:</span>
        <span id="ui-soldiers" class="res-value">0</span>
      </div>
    </div>

    <!-- Bottom Interface -->
    <div id="bottom-hud">
      <!-- Context Inspector & Info Card Panel -->
      <div id="inspector-panel" class="hud-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="panel-title" id="inspector-title" style="border-bottom: none; margin-bottom: 0;">Selection: None</div>
          <button id="btn-deselect" style="display:none; padding: 2px 8px; font-size: 10px;" onclick="deselectEntity()">Deselect</button>
        </div>
        <div id="inspector-details" style="font-size: 12px; color: #9a9f8e; min-height: 24px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px;">
          Left-click a unit or structure to select source tile. Left-click another tile to set target destination.
        </div>
        <div id="inspector-actions" class="btn-group"></div>
      </div>

      <!-- Quick Build Toolbar -->
      <div id="build-menu" class="hud-panel">
        <button onclick="setBuildMode('residence')"><img class="btn-icon-residence" /> Residence <span class="shortcut-tag">(100g)</span></button>
        <button onclick="setBuildMode('barracks')"><img class="btn-icon-barracks" /> Barracks <span class="shortcut-tag">(200g)</span></button>
        <button onclick="setBuildMode('armory')"><img class="btn-icon-armory" /> Armory <span class="shortcut-tag">(500g)</span></button>
        <button onclick="setBuildMode('radar')"><img class="btn-icon-radar" /> Radar <span class="shortcut-tag">(250g)</span></button>
      </div>
    </div>
  </div>

  <!-- HTML Sci-Fi Modal Dialog -->
  <dialog id="game-modal">
    <div class="dialog-title" id="modal-title">System Message</div>
    <div class="dialog-body" id="modal-body">Message details...</div>
    <div class="dialog-actions" id="modal-actions">
      <button onclick="closeDialog()">OK</button>
    </div>
  </dialog>

  <script>
    // ==========================================
    // 1. CONFIGURATION & ASSETS
    // ==========================================
    const TILE_SIZE = 64; // Pixels per grid square
    const TICK_RATE = 1000; // Economy tick interval (ms)

    const ASSETS = {
      tank: "tank.webp",
      soldier: "soldier.png",
      civilian: "civilian.webp",
      mine: "mine.webp",
      residence: "residence.webp",
      barracks: "barracks.webp",
      armory: "armory.png",
      radar: "radar.webp",
      resource: "resources.webp"
    };

    const BUILDING_INFO = {
      residence: {
        title: "Residence",
        desc: "Increases civilian population capacity (+10 cap bonus) and passively spawns new civilians.",
        stats: "Cost: 100g | Housing Cap: +10 Civilians | Garrison: 10 Units"
      },
      barracks: {
        title: "Barracks",
        desc: "Military recruitment hub. Converts available civilians into Soldiers.",
        stats: "Cost: 200g | Train: 50g + 1 Civilian | Garrison: 10 Units"
      },
      armory: {
        title: "Armory",
        desc: "Heavy weapons factory. Converts available civilians into armored Tanks.",
        stats: "Cost: 500g | Train: 300g + 1 Civilian | Garrison: 10 Units"
      },
      radar: {
        title: "Radar Station",
        desc: "Tactical reconnaissance installation providing strategic vision over adjacent tiles.",
        stats: "Cost: 250g | Vision Range: 4 Tiles | Garrison: 10 Units"
      },
      mine: {
        title: "Resource Mine",
        desc: "Resource extraction node. Generates gold when civilians mine or garrison inside.",
        stats: "Yield: ~1g/min per active miner | Worker Cap: 10 Civilians"
      }
    };

    const IMAGES = {};

    function loadAssets() {
      Object.keys(ASSETS).forEach(key => {
        const img = new Image();
        img.src = ASSETS[key];
        img.onload = () => { 
          IMAGES[key] = img; 
          updateUIcons();
        };
        img.onerror = () => { IMAGES[key] = null; };
      });
    }

    function updateUIcons() {
      const iconRes = document.getElementById('icon-res');
      const iconCiv = document.getElementById('icon-civ');
      const iconTank = document.getElementById('icon-tank');
      const iconSoldier = document.getElementById('icon-soldier');
      if (iconRes) iconRes.src = ASSETS.resource;
      if (iconCiv) iconCiv.src = ASSETS.civilian;
      if (iconTank) iconTank.src = ASSETS.tank;
      if (iconSoldier) iconSoldier.src = ASSETS.soldier;

      document.querySelectorAll('.btn-icon-residence').forEach(el => el.src = ASSETS.residence);
      document.querySelectorAll('.btn-icon-barracks').forEach(el => el.src = ASSETS.barracks);
      document.querySelectorAll('.btn-icon-armory').forEach(el => el.src = ASSETS.armory);
      document.querySelectorAll('.btn-icon-radar').forEach(el => el.src = ASSETS.radar);
    }

    loadAssets();

    // Dialog Utility System
    function showDialog(title, text, actions = []) {
      const dialog = document.getElementById('game-modal');
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = text;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';

      if (actions.length === 0) {
        actions.push({ label: 'OK', onClick: () => {} });
      }

      actions.forEach(action => {
        const btn = document.createElement('button');
        btn.innerText = action.label;
        btn.onclick = () => {
          if (action.onClick) action.onClick();
          dialog.close();
        };
        actionsEl.appendChild(btn);
      });

      dialog.showModal();
    }

    function closeDialog() {
      document.getElementById('game-modal').close();
    }

    // ==========================================
    // 2. STATE MANAGEMENT
    // ==========================================
    const state = {
      resources: 0,
      civilians: 15,
      civilianCap: 0, // Capped strictly based on total Residence housing capacity
      
      // Entities
      units: [],
      buildings: [],
      
      // Interaction State
      selectedEntityId: null,
      targetTile: null, // Selected target destination tile {x, y}
      hoveredTile: { x: 0, y: 0 },
      buildMode: null, // 'residence', etc.
      
      // Camera
      camera: {
        x: 0,
        y: 0,
        zoom: 1.0,
        isDragging: false,
        dragStart: { x: 0, y: 0 }
      },

      // Faction
      playerFaction: 'blue'
    };

    // Initialize Default Buildings & Civilians inside Residence
    function initGame() {
      // Starting Residences
      const res1 = createBuilding('residence', 2, 2, 'blue');
      const res2 = createBuilding('residence', 4, 2, 'blue');
      state.buildings.push(res1, res2);

      // Start all 15 initial Civilians housed directly inside the starting Residences
      for (let i = 0; i < 15; i++) {
        const targetRes = (i < 10) ? res1 : res2;
        const civ = createUnit('civilian', targetRes.tileX, targetRes.tileY, 'blue');
        civ.garrisonedBuildingId = targetRes.id;
        state.units.push(civ);
      }

      // Procedurally / Naturally Generated Mines across the map
      const numNaturalMines = 7;
      for (let i = 0; i < numNaturalMines; i++) {
        let rx, ry, attempts = 0;
        do {
          rx = Math.floor(Math.random() * 24) - 4;
          ry = Math.floor(Math.random() * 24) - 4;
          attempts++;
        } while (
          attempts < 50 && (
            state.buildings.some(b => b.tileX === rx && b.tileY === ry) ||
            Math.hypot(rx - 3, ry - 2) < 4 // Keep away from starting area
          )
        );
        state.buildings.push(createBuilding('mine', rx, ry, 'neutral'));
      }

      // Center camera on starting base
      state.camera.x = - (3 * TILE_SIZE - window.innerWidth / 2);
      state.camera.y = - (3 * TILE_SIZE - window.innerHeight / 2);
      
      updateUIcons();
    }

    // Entity Factories
    let idCounter = 1;

    function createUnit(type, x, y, faction = 'blue') {
      const isTank = type === 'tank';
      const isCivilian = type === 'civilian';
      const tileX = Math.floor(x);
      const tileY = Math.floor(y);

      return {
        id: idCounter++,
        entityType: 'unit',
        type: type, // 'soldier' | 'tank' | 'civilian'
        faction: faction,
        x: tileX, // Perfect integer tile coordinate
        y: tileY,
        targetX: tileX,
        targetY: tileY,
        hp: isTank ? 10 : 1,
        maxHp: isTank ? 10 : 1,
        speed: isTank ? 0.015 : (isCivilian ? 0.02 : 0.025), // Tiles per tick frame
        meleeDmg: isTank ? 10 : (isCivilian ? 0 : 1),
        // Tank Cannon Mechanics
        cannonDmg: isTank ? 5 : 0,
        cannonCooldown: 0, // Tick counter
        fireControl: 'aggressive', // 'aggressive' | 'ignore_infantry' | 'ignore_buildings' | 'prioritize_buildings' | 'hold_fire'
        selected: false,
        // Structure Entry & Mine Mechanics
        assignedMineId: null,
        targetMineId: null,
        garrisonedBuildingId: null, // Can enter ANY structure
        targetBuildingId: null
      };
    }

    function createBuilding(type, tileX, tileY, faction = 'blue') {
      const base = {
        id: idCounter++,
        entityType: 'building',
        type: type,
        faction: faction,
        tileX: tileX,
        tileY: tileY,
        hp: 20,
        maxHp: 20,
        assignedCivilians: 0,
        trainingQueue: [],
        capacity: 10 // Max capacity for garrisoning units in any structure
      };

      if (type === 'residence') { base.cost = 100; base.capBonus = 10; base.capacity = 10; }
      if (type === 'barracks') { base.cost = 200; base.capacity = 10; }
      if (type === 'armory') { base.cost = 500; base.capacity = 10; }
      if (type === 'radar') { base.cost = 250; base.vision = 4; base.capacity = 10; }
      if (type === 'mine') { base.capacity = 10; }

      return base;
    }

    // ==========================================
    // 3. CANVAS & CAMERA SYSTEM
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function worldToScreen(wx, wy) {
      return {
        x: (wx * TILE_SIZE + state.camera.x) * state.camera.zoom,
        y: (wy * TILE_SIZE + state.camera.y) * state.camera.zoom
      };
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx / state.camera.zoom - state.camera.x) / TILE_SIZE,
        y: (sy / state.camera.zoom - state.camera.y) / TILE_SIZE
      };
    }

    // ==========================================
    // 4. COMBAT & MOVEMENT
    // ==========================================
    function updateCombatAndMovement(deltaTime) {
      state.units.forEach(unit => {
        // Skip movement and combat processing for garrisoned units inside structures
        if (unit.garrisonedBuildingId) return;

        if (unit.x !== unit.targetX || unit.y !== unit.targetY) {
          const dx = unit.targetX - unit.x;
          const dy = unit.targetY - unit.y;
          const dist = Math.hypot(dx, dy);

          if (dist < unit.speed) {
            unit.x = unit.targetX;
            unit.y = unit.targetY;

            // On arriving at a target structure, enter/garrison inside if capacity permits
            if (unit.targetBuildingId) {
              const bld = state.buildings.find(b => b.id === unit.targetBuildingId);
              if (bld) {
                const garrisonedCount = state.units.filter(u => u.garrisonedBuildingId === bld.id).length;
                const maxCap = bld.capacity || bld.capBonus || 10;
                
                if (garrisonedCount < maxCap) {
                  unit.garrisonedBuildingId = bld.id;
                  if (bld.type === 'mine' && unit.type === 'civilian') {
                    unit.assignedMineId = bld.id;
                  }
                } else {
                  showDialog("Structure Full", `${bld.type.toUpperCase()} #${bld.id} has reached maximum garrison capacity (${maxCap}).`);
                }
              }
              unit.targetBuildingId = null;
            }

            // On arriving at a mine target for civilians
            if (unit.type === 'civilian' && unit.targetMineId) {
              const mine = state.buildings.find(b => b.id === unit.targetMineId);
              if (mine) {
                unit.assignedMineId = mine.id;
              }
              unit.targetMineId = null;
            }
          } else {
            unit.x += (dx / dist) * unit.speed;
            unit.y += (dy / dist) * unit.speed;
          }

          const currentTileX = Math.floor(unit.x);
          const currentTileY = Math.floor(unit.y);

          // Support multi-unit combat on the same tile
          state.units.forEach(enemy => {
            if (!enemy.garrisonedBuildingId && enemy.faction !== unit.faction && 
                Math.floor(enemy.x) === currentTileX && 
                Math.floor(enemy.y) === currentTileY) {
              
              enemy.hp -= unit.meleeDmg * (deltaTime / 1000);
              unit.hp -= enemy.meleeDmg * (deltaTime / 1000);
            }
          });
        }

        if (unit.type === 'tank' && unit.fireControl !== 'hold_fire') {
          unit.cannonCooldown += deltaTime;
          if (unit.cannonCooldown >= 10000) {
            const target = findTankTarget(unit);
            if (target) {
              target.hp -= unit.cannonDmg;
              unit.cannonCooldown = 0;
              drawCannonEffect(unit, target);
            }
          }
        }
      });

      state.units = state.units.filter(u => u.hp > 0);
      state.buildings = state.buildings.filter(b => b.hp > 0);
    }

    function findTankTarget(tank) {
      const tankTileX = Math.floor(tank.x);
      const tankTileY = Math.floor(tank.y);
      const candidates = [];

      if (tank.fireControl !== 'ignore_infantry') {
        state.units.forEach(u => {
          if (!u.garrisonedBuildingId && u.faction !== tank.faction) {
            const ux = Math.floor(u.x);
            const uy = Math.floor(u.y);
            if (Math.abs(ux - tankTileX) <= 1 && Math.abs(uy - tankTileY) <= 1) {
              candidates.push({ entity: u, type: 'unit' });
            }
          }
        });
      }

      if (tank.fireControl !== 'ignore_buildings') {
        state.buildings.forEach(b => {
          if (b.faction !== tank.faction) {
            if (Math.abs(b.tileX - tankTileX) <= 1 && Math.abs(b.tileY - tankTileY) <= 1) {
              candidates.push({ entity: b, type: 'building' });
            }
          }
        });
      }

      if (candidates.length === 0) return null;

      if (tank.fireControl === 'prioritize_buildings') {
        const building = candidates.find(c => c.type === 'building');
        if (building) return building.entity;
      }

      return candidates[0].entity;
    }

    let shotFlares = [];
    function drawCannonEffect(from, to) {
      const startX = Math.floor(from.x) + 0.5;
      const startY = Math.floor(from.y) + 0.5;
      const endX = (to.x !== undefined ? Math.floor(to.x) : to.tileX) + 0.5;
      const endY = (to.y !== undefined ? Math.floor(to.y) : to.tileY) + 0.5;
      
      shotFlares.push({
        x1: startX, y1: startY,
        x2: endX, y2: endY,
        life: 1.0
      });
    }

    // ==========================================
    // 5. ECONOMY & TIME TICK
    // ==========================================
    let civilianGrowthCounter = 0;
    setInterval(() => {
      let miners = 0;
      state.buildings.forEach(b => {
        if (b.type === 'mine') {
          const activeMiners = state.units.filter(u => u.type === 'civilian' && (u.assignedMineId === b.id || u.garrisonedBuildingId === b.id)).length;
          b.assignedCivilians = activeMiners;
          miners += activeMiners;
        }
      });

      state.resources += miners * (1 / 60);

      // Strictly cap civilians based on total housing capacity across active Residences
      let totalHousingCap = 0;
      state.buildings.forEach(b => {
        if (b.type === 'residence' && b.faction === 'blue') {
          totalHousingCap += (b.capBonus || 10);
        }
      });
      state.civilianCap = totalHousingCap;

      const currentCivilians = state.units.filter(u => u.type === 'civilian').length;
      state.civilians = currentCivilians;

      if (state.civilians < state.civilianCap) {
        civilianGrowthCounter++;
        if (civilianGrowthCounter >= 5) {
          const res = state.buildings.find(b => b.type === 'residence' && b.faction === 'blue');
          const spawnX = res ? res.tileX : 2;
          const spawnY = res ? res.tileY : 2;
          const newCiv = createUnit('civilian', spawnX, spawnY, 'blue');
          if (res) newCiv.garrisonedBuildingId = res.id;
          state.units.push(newCiv);
          civilianGrowthCounter = 0;
        }
      } else {
        civilianGrowthCounter = 0;
      }

      updateUI();
    }, TICK_RATE);

    // ==========================================
    // 6. INPUT HANDLING & SELECTION (LEFT CLICK ONLY MOVEMENT)
    // ==========================================
    canvas.addEventListener('mousedown', (e) => {
      const world = screenToWorld(e.clientX, e.clientY);
      const tileX = Math.floor(world.x);
      const tileY = Math.floor(world.y);

      if (e.button === 0) {
        // Left Click: Building Placement, Source Entity Selection, or Target Tile Movement
        if (state.buildMode) {
          placeBuilding(state.buildMode, tileX, tileY);
          state.buildMode = null;
          return;
        }

        const selected = getSelectedEntity();

        if (selected) {
          const selTileX = selected.entityType === 'unit' ? Math.floor(selected.x) : selected.tileX;
          const selTileY = selected.entityType === 'unit' ? Math.floor(selected.y) : selected.tileY;

          // If clicking a DIFFERENT tile while an entity is selected: issue Target Tile / Move / Enter command!
          if (tileX !== selTileX || tileY !== selTileY) {
            state.targetTile = { x: tileX, y: tileY };

            // Direct move / enter structure command if selected entity is a single deployed unit
            if (selected.entityType === 'unit' && !selected.garrisonedBuildingId) {
              selected.targetX = tileX;
              selected.targetY = tileY;

              const targetBld = state.buildings.find(b => b.tileX === tileX && b.tileY === tileY);
              if (targetBld) {
                selected.targetBuildingId = targetBld.id;
                if (targetBld.type === 'mine' && selected.type === 'civilian') {
                  selected.targetMineId = targetBld.id;
                } else {
                  selected.targetMineId = null;
                }
              } else {
                selected.targetBuildingId = null;
                selected.targetMineId = null;
                selected.assignedMineId = null;
              }
            }
            updateUI();
            return;
          }
        }

        // If no entity is selected, OR if left-clicking the same tile as the currently selected entity: cycle/select entity
        const unitsOnTile = state.units.filter(u => !u.garrisonedBuildingId && Math.floor(u.x) === tileX && Math.floor(u.y) === tileY);
        
        if (unitsOnTile.length > 0) {
          const currIndex = unitsOnTile.findIndex(u => u.id === state.selectedEntityId);
          if (currIndex !== -1) {
            const nextUnit = unitsOnTile[(currIndex + 1) % unitsOnTile.length];
            state.selectedEntityId = nextUnit.id;
          } else {
            state.selectedEntityId = unitsOnTile[0].id;
          }
        } else {
          const clickedBuilding = state.buildings.find(b => b.tileX === tileX && b.tileY === tileY);
          state.selectedEntityId = clickedBuilding ? clickedBuilding.id : null;
        }

        state.targetTile = null;
        updateUI();

      } else if (e.button === 2 || e.button === 1) {
        // Right Click / Middle Click: Camera Pan Dragging Only
        state.camera.isDragging = true;
        state.camera.dragStart = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const world = screenToWorld(e.clientX, e.clientY);
      state.hoveredTile = { x: Math.floor(world.x), y: Math.floor(world.y) };

      if (state.camera.isDragging) {
        const dx = e.clientX - state.camera.dragStart.x;
        const dy = e.clientY - state.camera.dragStart.y;
        state.camera.x += dx / state.camera.zoom;
        state.camera.y += dy / state.camera.zoom;
        state.camera.dragStart = { x: e.clientX, y: e.clientY };
      }
      
      updateUI();
    });

    window.addEventListener('mouseup', () => {
      state.camera.isDragging = false;
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      state.camera.zoom = Math.max(0.4, Math.min(2.5, state.camera.zoom * zoomFactor));
    });

    // ==========================================
    // 7. ACTIONS & COMMANDS
    // ==========================================
    function deselectEntity() {
      state.selectedEntityId = null;
      state.targetTile = null;
      updateUI();
    }

    function setBuildMode(structureType) {
      state.buildMode = structureType;
    }

    function placeBuilding(type, tileX, tileY) {
      const costs = { residence: 100, barracks: 200, armory: 500, radar: 250 };
      const cost = costs[type];

      if (state.resources < cost) {
        showDialog("Resource Deficit", `Insufficient resources to construct ${type.toUpperCase()}. Required: ${cost}g.`);
        return;
      }

      const occupied = state.buildings.some(b => b.tileX === tileX && b.tileY === tileY);
      if (occupied) return;

      state.resources -= cost;
      state.buildings.push(createBuilding(type, tileX, tileY, 'blue'));
      updateUI();
    }

    function trainUnit(building, unitType, count = 1, targetTile = null) {
      const costPerUnit = unitType === 'soldier' ? 50 : 300;
      let trainedCount = 0;

      for (let i = 0; i < count; i++) {
        const availableCivIdx = state.units.findIndex(u => u.type === 'civilian' && u.assignedMineId == null);

        if (availableCivIdx === -1) {
          if (trainedCount === 0) {
            showDialog("Recruitment Error", "Requires an available civilian to convert!");
          }
          break;
        }
        if (state.resources < costPerUnit) {
          if (trainedCount === 0) {
            showDialog("Resource Deficit", `Insufficient resources to train ${unitType.toUpperCase()}. Required: ${costPerUnit}g per unit.`);
          }
          break;
        }

        state.resources -= costPerUnit;
        state.units.splice(availableCivIdx, 1);

        const spawnX = building.tileX;
        const spawnY = building.tileY;
        const newUnit = createUnit(unitType, spawnX, spawnY, 'blue');

        if (targetTile) {
          newUnit.targetX = targetTile.x;
          newUnit.targetY = targetTile.y;

          const targetBld = state.buildings.find(b => b.tileX === targetTile.x && b.tileY === targetTile.y);
          if (targetBld) newUnit.targetBuildingId = targetBld.id;
        }

        state.units.push(newUnit);
        trainedCount++;
      }
      updateUI();
    }

    function deployUnitsFromStructure(building, count, targetTile) {
      const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === building.id);
      const dispatchCount = Math.min(count, garrisonedUnits.length);

      const targetBld = state.buildings.find(b => b.tileX === targetTile.x && b.tileY === targetTile.y);

      for (let i = 0; i < dispatchCount; i++) {
        const unit = garrisonedUnits[i];
        unit.garrisonedBuildingId = null;
        unit.assignedMineId = null;
        unit.x = building.tileX;
        unit.y = building.tileY;
        unit.targetX = targetTile.x;
        unit.targetY = targetTile.y;

        if (targetBld) {
          unit.targetBuildingId = targetBld.id;
          if (targetBld.type === 'mine' && unit.type === 'civilian') {
            unit.targetMineId = targetBld.id;
          }
        } else {
          unit.targetBuildingId = null;
          unit.targetMineId = null;
        }
      }
      updateUI();
    }

    function getSelectedEntity() {

    // ==========================================
    // 8. RENDER PIPELINE
    // ==========================================
    function render() {
      ctx.fillStyle = '#0b0d0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(state.camera.zoom, state.camera.zoom);

      const startTileX = Math.floor(-state.camera.x / TILE_SIZE);
      const startTileY = Math.floor(-state.camera.y / TILE_SIZE);
      const endTileX = startTileX + Math.ceil(canvas.width / (TILE_SIZE * state.camera.zoom)) + 1;
      const endTileY = startTileY + Math.ceil(canvas.height / (TILE_SIZE * state.camera.zoom)) + 1;

      // Draw Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;

      for (let x = startTileX; x < endTileX; x++) {
        const sx = x * TILE_SIZE + state.camera.x;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, canvas.height / state.camera.zoom);
        ctx.stroke();
      }
      for (let y = startTileY; y < endTileY; y++) {
        const sy = y * TILE_SIZE + state.camera.y;
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(canvas.width / state.camera.zoom, sy);
        ctx.stroke();
      }

      // Draw Source-to-Target Selection Line & Target Marker
      const selectedEntity = getSelectedEntity();
      if (selectedEntity && state.targetTile) {
        const sourceX = (selectedEntity.x !== undefined ? Math.floor(selectedEntity.x) : selectedEntity.tileX) * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
        const sourceY = (selectedEntity.y !== undefined ? Math.floor(selectedEntity.y) : selectedEntity.tileY) * TILE_SIZE + state.camera.y + TILE_SIZE / 2;
        const targetX = state.targetTile.x * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
        const targetY = state.targetTile.y * TILE_SIZE + state.camera.y + TILE_SIZE / 2;

        ctx.strokeStyle = '#d9a441';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(sourceX, sourceY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Highlight Target Tile Circle Marker
        ctx.strokeStyle = '#d9a441';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(targetX, targetY, 18, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Render Buildings
      state.buildings.forEach(b => {
        const px = b.tileX * TILE_SIZE + state.camera.x;
        const py = b.tileY * TILE_SIZE + state.camera.y;

        let img = null;
        if (b.type === 'mine') img = IMAGES.mine;
        if (b.type === 'residence') img = IMAGES.residence;
        if (b.type === 'barracks') img = IMAGES.barracks;
        if (b.type === 'armory') img = IMAGES.armory;
        if (b.type === 'radar') img = IMAGES.radar;

        if (img) {
          const imgX = px + (TILE_SIZE - img.width) / 2;
          const imgY = py + (TILE_SIZE - img.height) / 2;
          ctx.drawImage(img, imgX, imgY);
        } else {
          ctx.fillStyle = b.type === 'mine' ? '#5b8ab5' : 
                          b.type === 'residence' ? '#7a9d5c' : 
                          b.type === 'barracks' ? '#c17a3f' : '#8f6f9e';
          ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        }

        if (b.id === state.selectedEntityId) {
          ctx.strokeStyle = '#d9a441';
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        }
      });

      // Render Active Unit Path Lines
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;

        if (u.x !== u.targetX || u.y !== u.targetY) {
          const startX = u.x * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
          const startY = u.y * TILE_SIZE + state.camera.y + TILE_SIZE / 2;
          const endX = u.targetX * TILE_SIZE + state.camera.x + TILE_SIZE / 2;
          const endY = u.targetY * TILE_SIZE + state.camera.y + TILE_SIZE / 2;

          ctx.strokeStyle = u.type === 'civilian' ? 'rgba(34, 197, 94, 0.4)' : 'rgba(217, 164, 65, 0.3)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Pass 1: Multi-unit tile stack count calculation
      const tileUnitCounts = {};
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;
        const key = `${Math.floor(u.x)},${Math.floor(u.y)}`;
        tileUnitCounts[key] = (tileUnitCounts[key] || 0) + 1;
      });

      // Pass 2: Draw multi-occupancy units cleanly spaced inside their tile boundary
      const tileUnitIndices = {};
      state.units.forEach(u => {
        if (u.garrisonedBuildingId) return;

        const tileKey = `${Math.floor(u.x)},${Math.floor(u.y)}`;
        const totalOnTile = tileUnitCounts[tileKey];
        const idxOnTile = tileUnitIndices[tileKey] || 0;
        tileUnitIndices[tileKey] = idxOnTile + 1;

        let subOffsetX = 0;
        let subOffsetY = 0;
        if (totalOnTile > 1) {
          const angle = (idxOnTile / totalOnTile) * Math.PI * 2;
          const radius = Math.min(14, 6 + totalOnTile * 2);
          subOffsetX = Math.cos(angle) * radius;
          subOffsetY = Math.sin(angle) * radius;
        }

        const px = u.x * TILE_SIZE + state.camera.x + subOffsetX;
        const py = u.y * TILE_SIZE + state.camera.y + subOffsetY;

        const assetKey = u.type === 'tank' ? 'tank' : (u.type === 'civilian' ? 'civilian' : 'soldier');
        const img = IMAGES[assetKey];
        if (img) {
          const imgX = px + (TILE_SIZE - img.width) / 2;
          const imgY = py + (TILE_SIZE - img.height) / 2;
          ctx.drawImage(img, imgX, imgY);
        } else {
          ctx.fillStyle = u.type === 'tank' ? '#c1443a' : (u.type === 'civilian' ? '#c9a13c' : '#c17a3f');
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, u.type === 'tank' ? 18 : 10, 0, Math.PI * 2);
          ctx.fill();
        }

        if (u.id === state.selectedEntityId) {
          ctx.strokeStyle = '#d9a441';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 20, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(px + 8, py - 6, TILE_SIZE - 16, 4);
        ctx.fillStyle = '#7a9d5c';
        ctx.fillRect(px + 8, py - 6, (TILE_SIZE - 16) * (u.hp / u.maxHp), 4);
      });

      // Render Cannon Flare Effects
      shotFlares.forEach((flare) => {
        ctx.strokeStyle = `rgba(251, 146, 60, ${flare.life})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(flare.x1 * TILE_SIZE + state.camera.x, flare.y1 * TILE_SIZE + state.camera.y);
        ctx.lineTo(flare.x2 * TILE_SIZE + state.camera.x, flare.y2 * TILE_SIZE + state.camera.y);
        ctx.stroke();
        flare.life -= 0.05;
      });
      shotFlares = shotFlares.filter(f => f.life > 0);

      // Render Tile Hover Highlight
      const hx = state.hoveredTile.x * TILE_SIZE + state.camera.x;
      const hy = state.hoveredTile.y * TILE_SIZE + state.camera.y;
      ctx.strokeStyle = state.buildMode ? '#7a9d5c' : 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;
      ctx.strokeRect(hx, hy, TILE_SIZE, TILE_SIZE);

      ctx.restore();
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      const deltaTime = now - lastTime;
      lastTime = now;

      updateCombatAndMovement(deltaTime);
      render();

      requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 9. UI UPDATER (WEB PAGE HUD & INSPECTOR PANEL)
    // ==========================================
    function updateUI() {
      document.getElementById('ui-resources').innerText = Math.floor(state.resources);
      const totalCivs = state.units.filter(u => u.type === 'civilian').length;
      document.getElementById('ui-civilians').innerText = `${totalCivs} / ${state.civilianCap}`;
      
      let totalMiners = state.units.filter(u => u.type === 'civilian' && (u.assignedMineId != null || u.garrisonedBuildingId != null)).length;
      document.getElementById('ui-miners').innerText = totalMiners;

      const soldierCount = state.units.filter(u => u.type === 'soldier').length;
      const tankCount = state.units.filter(u => u.type === 'tank').length;
      document.getElementById('ui-tanks').innerText = tankCount;
      document.getElementById('ui-soldiers').innerText = soldierCount;

      const entity = getSelectedEntity();
      const titleEl = document.getElementById('inspector-title');
      const detailsEl = document.getElementById('inspector-details');
      const actionsEl = document.getElementById('inspector-actions');
      const deselectBtn = document.getElementById('btn-deselect');
      actionsEl.innerHTML = '';

      if (!entity) {
        // Hover Preview Info Card inside the Web Interface
        const hoveredBld = state.buildings.find(b => b.tileX === state.hoveredTile.x && b.tileY === state.hoveredTile.y);
        if (hoveredBld) {
          const info = BUILDING_INFO[hoveredBld.type] || { title: hoveredBld.type, desc: '', stats: '' };
          const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === hoveredBld.id);
          const maxCap = hoveredBld.capacity || hoveredBld.capBonus || 10;

          let unitBreakdown = "";
          if (garrisonedUnits.length === 0) {
            unitBreakdown = "<span style='color: #5f6459;'>None</span>";
          } else {
            const counts = {};
            garrisonedUnits.forEach(u => { counts[u.type] = (counts[u.type] || 0) + 1; });
            unitBreakdown = Object.entries(counts)
              .map(([type, count]) => `<span style="color:#d9a441;">${count} ${type.charAt(0).toUpperCase() + type.slice(1)}${count > 1 ? 's' : ''}</span>`)
              .join(', ');
          }

          titleEl.innerText = `Hover Preview: ${info.title} #${hoveredBld.id}`;
          detailsEl.innerHTML = `
            <div style="margin-bottom: 4px;">
              <strong style="color: #e8e4d8;">${info.title} Info Card</strong>
              <div style="color: #5f6459; font-size: 11px;">${info.stats}</div>
            </div>
            <div style="margin-bottom: 6px; font-size: 11px; color: #9a9f8e;">${info.desc}</div>
            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;">
              <div><strong>HP:</strong> ${hoveredBld.hp}/${hoveredBld.maxHp} | <strong>Tile:</strong> (${hoveredBld.tileX}, ${hoveredBld.tileY})</div>
              <div style="margin-top: 2px;"><strong>Units Inside (${garrisonedUnits.length}/${maxCap}):</strong> ${unitBreakdown}</div>
            </div>
          `;
          deselectBtn.style.display = 'none';
          return;
        }

        titleEl.innerText = 'Selection: None';
        detailsEl.innerText = 'Left-click a unit or structure to select source tile. Left-click another tile to set target destination.';
        deselectBtn.style.display = 'none';
        return;
      }

      deselectBtn.style.display = 'block';
      const targetText = state.targetTile ? ` | Target: (${state.targetTile.x}, ${state.targetTile.y})` : ' | Target: None (Left-click grid)';

      if (entity.entityType === 'unit') {
        const uTileX = Math.floor(entity.x);
        const uTileY = Math.floor(entity.y);
        const unitsOnSameTile = state.units.filter(u => !u.garrisonedBuildingId && Math.floor(u.x) === uTileX && Math.floor(u.y) === uTileY);
        const uIdx = unitsOnSameTile.findIndex(u => u.id === entity.id) + 1;
        
        const stackText = unitsOnSameTile.length > 1 ? ` (${uIdx} of ${unitsOnSameTile.length} on Tile)` : '';

        titleEl.innerText = `${entity.type.toUpperCase()} (ID: ${entity.id})${stackText}`;
        detailsEl.innerText = `HP: ${Math.ceil(entity.hp)}/${entity.maxHp} | Tile: (${uTileX}, ${uTileY})${targetText}`;

        if (entity.type === 'civilian') {
          const status = entity.assignedMineId ? `Mining Mine #${entity.assignedMineId}` : 'Idle / Moving';
          detailsEl.innerText += ` | Status: ${status}`;
        } else if (entity.type === 'tank') {
          detailsEl.innerText += ` | Cannon DPS: 0.5`;
          
          const modes = ['aggressive', 'ignore_infantry', 'ignore_buildings', 'prioritize_buildings', 'hold_fire'];
          modes.forEach(mode => {
            const btn = document.createElement('button');
            btn.className = `fc-btn ${entity.fireControl === mode ? 'active-mode' : ''}`;
            btn.innerText = mode.replace('_', ' ');
            btn.onclick = () => setFireControl(entity, mode);
            actionsEl.appendChild(btn);
          });
        }
      } else if (entity.entityType === 'building') {
        const info = BUILDING_INFO[entity.type] || { title: entity.type, desc: '', stats: '' };
        const garrisonedUnits = state.units.filter(u => u.garrisonedBuildingId === entity.id);
        const maxCap = entity.capacity || entity.capBonus || 10;

        let unitBreakdown = "";
        if (garrisonedUnits.length === 0) {
          unitBreakdown = "<span style='color: #5f6459;'>None</span>";
        } else {
          const counts = {};
          garrisonedUnits.forEach(u => { counts[u.type] = (counts[u.type] || 0) + 1; });
          unitBreakdown = Object.entries(counts)
            .map(([type, count]) => `<span style="color:#d9a441;">${count} ${type.charAt(0).toUpperCase() + type.slice(1)}${count > 1 ? 's' : ''}</span>`)
            .join(', ');
        }

        titleEl.innerText = `${info.title.toUpperCase()} (ID: ${entity.id})`;

        detailsEl.innerHTML = `
          <div style="margin-bottom: 4px;">
            <strong style="color: #e8e4d8;">${info.title} Info Card</strong>
            <div style="color: #5f6459; font-size: 11px;">${info.stats}</div>
          </div>
          <div style="margin-bottom: 6px; font-size: 11px; color: #9a9f8e;">${info.desc}</div>
          <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;">
            <div><strong>HP:</strong> ${entity.hp}/${entity.maxHp} | <strong>Tile:</strong> (${entity.tileX}, ${entity.tileY})${targetText}</div>
            <div style="margin-top: 2px;"><strong>Units Inside (${garrisonedUnits.length}/${maxCap}):</strong> ${unitBreakdown}</div>
          </div>
        `;

        // Deploy button available for ANY structure holding garrisoned units
        if (garrisonedUnits.length > 0) {
          const deployBtn = document.createElement('button');
          deployBtn.innerHTML = `<img src="${ASSETS.civilian}" /> Deploy Garrisoned Units`;
          deployBtn.onclick = () => openStructureGarrisonDialog(entity);
          actionsEl.appendChild(deployBtn);
        }

        if (entity.type === 'barracks') {
          const trainBtn = document.createElement('button');
          trainBtn.innerHTML = `<img src="${ASSETS.soldier}" /> Train / Rally Options`;
          trainBtn.onclick = () => openBarracksDialog(entity);
          actionsEl.appendChild(trainBtn);

        } else if (entity.type === 'armory') {
          const trainBtn = document.createElement('button');
          trainBtn.innerHTML = `<img src="${ASSETS.tank}" /> Train / Rally Options`;
          trainBtn.onclick = () => openArmoryDialog(entity);
          actionsEl.appendChild(trainBtn);
        }
      }
    }

    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
